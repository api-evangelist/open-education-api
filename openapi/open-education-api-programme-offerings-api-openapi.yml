openapi: 3.2.0
info:
  version: 6.0-rc.3
  title: Open Education programme offerings API
  description: OpenAPI (fka Swagger) specification for the Open Education API.
  license:
    name: EUPL-1.2
    url: https://github.com/open-education-api/specification/blob/release/6.0/LICENSE.md
  contact:
    name: OEAPI Working Group / SURF
    url: https://oeapi.eu
    email: info@oeapi.eu
  x-logo:
    url: ./logo.png
    href: ./docs.html
servers:
- url: https://demo01.eduapi.nl/v6
  description: SURF demo implementation
security: []
tags:
- name: programme offerings
  description: 'The offerings API provides information about programme offerings which have a

    global timeframe, e.g. a period to which students can enrol.'
paths:
  /academic-sessions/{academicSessionId}/programme-offerings:
    get:
      summary: GET /academic-sessions/{academicSessionId}/programme-offerings
      operationId: listProgrammeOfferingsByAcademicSessionId
      description: Get a list of all programme offerings during this academic session
      tags:
      - programme offerings
      parameters:
      - name: academicSessionId
        in: path
        description: Academic session ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - $ref: '#/components/parameters/offeringState'
      - name: resultExpected
        in: query
        description: Filter by resultExpected
        required: false
        schema:
          type: boolean
      - name: since
        in: query
        description: Filter all offerings by providing a minimum start moment for the corresponding academic session, RFC3339 (full-date). By default only future offerings are shown (equal to `?since=<today>`).
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Filter all offerings by providing a maximum end moment for the corresponding academic session, RFC3339 (full-date).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProgrammeOffering'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
  /organisations/{organisationId}/programme-offerings:
    get:
      summary: GET /organisations/{organisationId}/programme-offerings
      operationId: listProgrammeOfferingsByOrganisationId
      description: Get a list of all programme offerings for a given organisation
      tags:
      - programme offerings
      parameters:
      - name: organisationId
        in: path
        description: Organisation ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - $ref: '#/components/parameters/offeringState'
      - name: resultExpected
        in: query
        description: Filter by resultExpected
        required: false
        schema:
          type: boolean
      - name: since
        in: query
        description: Filter all offerings by providing a minimum start moment (dateTime) for the corresponding academic session, RFC3339 (full-date). By default only future offerings are shown (equal to `?since=<today>`).
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Filter all offerings by providing a maximum end moment (dateTime) for the corresponding academic session, RFC3339 (full-date).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProgrammeOffering'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
  /programme-offerings/{programmeOfferingId}:
    get:
      summary: GET /programme-offerings/{programmeOfferingId}
      operationId: listProgrammeOfferingsById
      description: Get a single programme offering.
      tags:
      - programme offerings
      parameters:
      - name: programmeOfferingId
        in: path
        description: Programme Offering ID
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        explode: false
        description: Optional properties to expand, separated by a comma
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
            enum:
            - academic_session
            - organisation
            - programme
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                $ref: '#/components/schemas/ProgrammeOffering'
                title: programmeOffering
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    put:
      summary: PUT /programme-offerings/{programmeOfferingId}
      operationId: replaceProgrammeOfferingsById
      description: Update all attributes of a single programme offering.
      tags:
      - programme offerings
      parameters:
      - name: programmeOfferingId
        in: path
        description: Programme Offering ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/vnd.oeapi+json:
            schema:
              $ref: '#/components/schemas/ProgrammeOffering'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    patch:
      summary: PATCH /programme-offerings/{programmeOfferingId}
      operationId: partialUpdateProgrammeOfferingsById
      description: Change attributes of a single programme offering.
      tags:
      - programme offerings
      parameters:
      - name: programmeOfferingId
        in: path
        description: Programme Offering ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/vnd.oeapi+json:
            schema:
              $ref: '#/components/schemas/ProgrammeOffering'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
  /programmes/{programmeId}/programme-offerings:
    get:
      summary: GET /programmes/{programmeId}/programme-offerings
      operationId: listOfferingsByProgrammeId
      description: Get a list of all offerings for this programme, ordered chronologically.
      tags:
      - programme offerings
      parameters:
      - name: programmeId
        in: path
        description: Programme ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - $ref: '#/components/parameters/offeringState'
      - name: modeOfStudy
        in: query
        description: Filter by modeOfStudy
        required: false
        schema:
          $ref: '#/components/schemas/modeOfStudy'
      - name: resultExpected
        in: query
        description: Filter by resultExpected
        required: false
        schema:
          type: boolean
      - name: since
        in: query
        description: Filter all offerings by providing a minimum start moment (dateTime) for the corresponding academic session, RFC3339 (full-date). By default only future offerings are shown (equal to `?since=<today>`).
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Filter all offerings by providing a maximum end moment (dateTime) for the corresponding academic session, RFC3339 (full-date).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProgrammeOffering'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
components:
  parameters:
    consumer:
      name: consumer
      in: query
      description: Request entities intended for a specific consumer. The `consumer` profile allows for adding additional data, or specific rules concerning the presentation of the data. A consumer can be selected based on the key of the consumer profile. An implementation of the OEAPI SHOULD always return the consumer information inside the consumer property of the object(s) that are requested. Further information regarding the use of consumers can be found in the [documentation](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/)
      required: false
      schema:
        type: string
    teachingLanguage:
      name: teachingLanguage
      in: query
      description: Filter by teachingLanguage, which is a string describing the main teaching language, should be at least a two-letter language code as specified by ISO 6467.
      required: false
      schema:
        type: string
        pattern: ^([a-z]{2,3})(-([A-Z]{2}|[0-9]{3}))?(-([a-z]{4}))?(-([a-z]{2}|[0-9]{3}))*(-[a-z0-9]{2,8})*(-x(-[a-z0-9]{1,8})+)?$
        minLength: 2
      example: nl
    offeringState:
      name: state
      in: query
      description: Filter by an Offering's `state`.
      required: false
      schema:
        $ref: '#/components/schemas/offeringState'
    pageNumber:
      name: pageNumber
      in: query
      description: The page number to get. Page numbers start at 1.
      required: false
      schema:
        type: integer
        format: int32
        example: 1
        minimum: 1
    search:
      name: q
      in: query
      description: Filter by items having a name, abbreviation or description containing the given search term (exact partial match, case insensitive)
      required: false
      schema:
        type: string
    pageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        enum:
        - 10
        - 20
        - 50
        - 100
        - 250
    filterQuery:
      name: filter_query
      in: query
      required: false
      x-lint-ignore:
      - camel-case-properties
      style: deepObject
      explode: true
      description: "Filter object serialised as `filter_query[field][operation]=value`.\nMultiple top-level fields are combined with AND. CSV is accepted where noted.\n\nOR blocks. Provide an array of single-field filter objects, each combined with OR.\nSerialises as `filter_query[__or][][field][operation]=value`.\n\nInspired by Storyblok (https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries)\n\nWildcards:\n- Prefer using only the asterisk `*` as a wildcard for partial matches (e.g., like and not_like).\n\nImplementation note:\n- The availability and behaviour of this query functionality are entirely determined by the organisation hosting\n  the API implementation. It is not mandatory for implementers to support this functionality, and it cannot be enforced \n  upon organisations that provide or consume OEAPI endpoints.\n- It is up to each implementer to decide whether to support this feature. It is **not** a requirement of the OEAPI \n  standard itself.\n- Consumers or working groups that wish to apply specific filtering mechanisms are encouraged to do so using \n  this approach for the sake of consistency across implementations.\n\nExamples:  \n- **Filter course offerings by programme, delivery, language and start date**  \n  `filter_query[programme.code][in]=B-IT-2025&filter_query[organisation.code][in]=RuG&filter_query[mode_of_delivery][in]=on_campus,hybrid&filter_query[language_of_instruction][in]=en-GB&filter_query[start_date][gt_date]=2025-09-01T00:00:00Z`  \n  \n- **Only offerings with email contact present**  \n  `filter_query[contacts.email][is]=not_empty`\n\n- **Provider is Org A or Org B, OR campus city contains “Utrecht”**  \n  `?filter_query[__or][][organisation.id][in]=org-uu,org-hku&filter_query[__or][][campus.city][like]=*Utrecht*`  \n    \n- **Start date after 1 Sept 2025 OR has evening/block_week tag**  \n  `?filter_query[__or][][start_date][gt_date]=2025-09-01T00:00:00Z&filter_query[__or][][tags][any_in_array]=evening,block_week`  \n"
      schema:
        type: object
        properties:
          __or:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
                properties:
                  in:
                    type: string
                    description: Exact match; multiple values allowed as CSV.
                    example: org-uu,org-hku
                  like:
                    type: string
                    description: 'Partial match using wildcards. Prefer `*` as the wildcard.

                      # Quotes are required here because YAML interprets unquoted * as an alias reference.

                      '
                    example: '*Utrecht*'
                  any_in_array:
                    type: string
                    description: Match if any of the CSV values occur.
                    example: evening,block_week
                  gt_date:
                    type: string
                    format: date-time
                    description: ISO 8601 / RFC 3339 date-time.
                    example: '2025-09-01T00:00:00Z'
                  lt_date:
                    type: string
                    format: date-time
                    description: ISO 8601 / RFC 3339 date-time.
                    example: '2025-12-31T23:59:59Z'
        additionalProperties:
          type: object
          properties:
            is:
              $ref: '#/components/schemas/filterPresence'
            in:
              type: string
              description: Exact match; multiple values allowed as CSV.
              example: RuG
            not_in:
              type: string
              description: Negated inclusion; multiple values as CSV.
              example: UvA,VU
            like:
              type: string
              description: 'Partial match using wildcards. Prefer `*` as the wildcard.

                '
              example: '*Amsterdam*'
            not_like:
              type: string
              description: 'Negated partial match using wildcards. Prefer `*` as the wildcard.

                '
              example: '*deprecated*'
            any_in_array:
              type: string
              description: Match if any of the CSV values occur.
              example: evening,block_week
            all_in_array:
              type: string
              description: Match if all CSV values occur.
              example: evening,block_week
            gt_int:
              type: integer
              description: Greater than (integer).
              example: 5
            lt_int:
              type: integer
              description: Less than (integer).
              example: 30
            gt_float:
              type: number
              description: Greater than (float).
              example: 5.5
            lt_float:
              type: number
              description: Less than (float).
              example: 12
            gt_date:
              type: string
              format: date-time
              description: ISO 8601 date-time.
              example: '2025-09-01T00:00:00Z'
            lt_date:
              type: string
              format: date-time
              description: ISO 8601 date-time.
              example: '2025-12-31T23:59:59Z'
    fields:
      name: fields
      in: query
      required: false
      style: form
      explode: false
      description: "Allows clients to indicate which fields should be included in the response.  \nThis parameter supports the principle of data minimisation and helps to optimise \ndata usage and performance by reducing unnecessary data transmission.\n\nThe `fields` parameter uses *nested field selection syntax* with parentheses for subfields, \nfor example: `programme(code)` or `campus(city)`.  \nMultiple fields can be grouped within parentheses, for example:  \n`fields=(id,title,ectsCredits,programme(code),campus(city))`.\n\nWhen omitted, the server returns all fields the client has access to.  \nUnknown field names SHOULD be ignored.  \nThe server MUST always include *mandatory fields* (e.g., identifiers such as `id`) \nthat are required for a valid or minimal response, even if not explicitly requested.\n\n*Important:* This is a **request hint**, not a **security feature**.  \nThe server MAY disregard the request for a restricted set of fields, and the final response \nstructure MAY depend on server logic and the client’s access rights.\n\n\nIf a client requests unauthorised fields, these MUST be silently omitted or redacted.\n"
      schema:
        type: string
        example: (id,title,ectsCredits,programme(code),campus(city))
      examples:
        minimal:
          summary: Return a minimal fieldset for course offerings
          value: (id,title,ectsCredits,languageOfInstruction)
        nested:
          summary: Include nested programme code and campus city
          value: (id,title,programme(code),campus(city))
        combined:
          summary: Example using multiple nested fields
          value: (id,title,ectsCredits,programme(code,name),campus(city,country))
  schemas:
    ProblemVersionNotAcceptable:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - requestedVersion
        - supportedVersions
        properties:
          type:
            $ref: '#/components/schemas/type'
          title:
            $ref: '#/components/schemas/title'
          consumer:
            description: 'Indicates which party caused the version mismatch. When null, the 406 was

              triggered by an unsupported OEAPI version. If populated with a Consumer

              object, the 406 was caused by a consumer-specific version that did not match

              any supported version. This field MAY contain a full Consumer object or be

              null.

              '
            oneOf:
            - $ref: '#/components/schemas/Consumer'
            - type: 'null'
          requestedVersion:
            type: string
            description: The version requested by the client.
            example: '5.0'
          supportedVersions:
            type: array
            description: Versions the server can serve, typically in descending order.
            items:
              type: string
            example:
            - '4.2'
            - '4.1'
    Language:
      description: 'The language used in the described entity. The value **must be a language tag that conforms to RFC 5646** (Tags for Identifying Languages, BCP 47):

        https://www.rfc-editor.org/rfc/rfc5646.html


        A tag consists of the following components, in this exact order:

        1. **language** – two‑ to three‑letter codes (ISO 639‑1/‑2) **or** four‑letter codes (ISO 639‑5) **or** five‑ to eight‑letter registered language subtags.

        2. **script** – optional, four letters in Title‑Case (e.g. `Latn`, `Hant`).

        3. **region** – optional, either two uppercase letters (ISO 3166‑1) **or** three digits (UN M.49).

        4. **variant** – zero or more subtags, each either five‑ to eight‑alphanumerics or a digit followed by three alphanumerics (e.g. `1901`, `oxendict`).

        5. **extension** – zero or more extensions. Each extension starts with a *singleton* (a single alphanumeric character except `x`) followed by one or more subtags of two‑ to eight‑alphanumerics (e.g. `u‑co‑phonebk`).

        6. **private‑use** – optional, the letter `x` followed by one or more subtags of one‑ to eight‑alphanumerics (e.g. `x‑private`).


        The most common form is a two‑letter language code (ISO 639‑1) optionally followed by a hyphen and a two‑letter country code (ISO 3166‑1), for example `en` or `en‑GB`.


        More specific tags are also valid, for instance `zh‑Hant‑TW` (Traditional Chinese as used in Taiwan).


        For sign languages two conventions are recognised:

        * `sgn` – e.g. `nl‑sgn‑NL` (Dutch Sign Language)

        * `s`   – e.g. `nl‑s‑NL` (Dutch Sign Language)

        '
      type: string
      minLength: 2
      pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,2}|[A-Za-z]{4}|[A-Za-z]{5,8})(?:-[A-Za-z]{4})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*?(?:-(?:[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+))*?(?:-x(?:-[A-Za-z0-9]{1,8})+)?|x(?:-[A-Za-z0-9]{1,8})+)$
      example: en-GB
    Consumer:
      type: object
      description: The additional elements of a consumer that may be provided, see the [documentation on support for specific consumers](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/) for further information about this mechanism.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/). This key is used to select the additional data to be presented in the request.
          type: string
          example: test-consumer
        exampleProperty:
          description: An example of an additional property
          type:
          - string
          - 'null'
          example: value-of-example-property
      additionalProperties: true
    filterPresence:
      type: string
      description: "Presence check or special value for filter operations.\n\nInspired by Storyblok (https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries)\n\nImplementation note:\n- The availability and behaviour of this query functionality are entirely determined by the organisation hosting\n  the API implementation. It is not mandatory for implementers to support this functionality, and it cannot be enforced \n  upon organisations that provide or consume OEAPI endpoints.\n- It is up to each implementer to decide whether to support this feature. It is **not** a requirement of the OEAPI \n  standard itself.\n- Consumers or working groups that wish to apply specific filtering mechanisms are encouraged to do so using \n  this approach for the sake of consistency across implementations.\n"
      enum:
      - empty
      - not_empty
      - empty_array
      - not_empty_array
      - 'true'
      - 'false'
      - 'null'
      - not_null
      example: not_empty
    codeType:
      type: string
      description: 'The type of code or identifier.


        The predefined values are:


        | Code                      | Description                                                       |

        |---------------------------|-------------------------------------------------------------------|

        | `account_id`              | Identifier for an account.                                        |

        | `bag_id`                  | Identifier for a building in the Dutch Building and Address       |

        |                           | Registry (BAG).                                                   |

        | `building_id`             | Identifier for a building.                                        |

        | `component_code`          | Identifier for a component (part of a course).                    |

        | `eckid`                   | Identifier assigned within the Dutch *Educatieve ContentKeten iD* |

        |                           | framework. It enables persistent identification and exchange of   |

        |                           | digital learning resources within the Dutch educational sector for|

        |                           | EQF levels 1, 2, 3 and 4. Comparable international approaches     |

        |                           | include LRMI, DOI and Handle                                      |

        |                           | identifiers for learning resources.                               |

        | `email_address`           | An email address.                                                 |

        | `esi`                     | European Student Identifier.                                      |

        | `group_code`              | Identifier for a group of people.                                 |

        | `group_type_code`         | Identifier for the type of group.                                 |

        | `identifier`              | Generic identifier.                                               |

        | `institution_code`        | Registration number of an educational institution. In the         |

        |                           | Netherlands, the former BRIN code has been replaced by the        |

        |                           | institution code, issued by the Ministry of Education, Culture    |

        |                           | and Science (OCW).                                                |

        | `isbn`                    | International Standard Book Number (for books).                   |

        | `issn`                    | International Standard Serial Number (for periodicals).           |

        | `kvk_organisation_id`     | Identifier for a KvK (Dutch Chamber of Commerce) registered       |

        |                           | organisation.                                                     |

        | `kvk_establishment_id`    | Identifier for a specific establishment of a KvK                  |

        |                           | (Dutch Chamber of Commerce) registered organisation.              |

        | `leerbedrijf_id`          | Dutch registration/accreditation id for organisations offering    |

        |                           | internships for vocational education students.                    |

        | `national_identity_number`| Government-assigned personal identifier (e.g. NI number in the UK,|

        |                           | or *personnummer* in Sweden).                                     |

        | `offering_code`           | Identifier for a specific offering (programme, course or          |

        |                           | component).                                                       |

        | `organisation_id`         | Identifier for an organisation.                                   |

        | `orcid`                   | Open Researcher and Contributor ID.                               |

        | `product_id`              | Identifier for a product.                                         |

        | `programme_code`          | Identifier of a programme (a recognised collection of courses).   |

        |                           | In the Netherlands, the former CREBO and CROHO codes have been    |

        |                           | replaced by the programme code as registered in RIO, under the    |

        |                           | authority of OCW.                                                 |

        | `room_code`               | Identifier for a room.                                            |

        | `schac_home`              | Home organisation represented by its domain name.                 |

        | `student_number`          | Identifier for a student.                                         |

        | `studielink_number`       | Identifier assigned to a student by Studielink (Dutch central     |

        |                           | enrolment system).                                                |

        | `system_id`               | Identifier used within a specific system.                         |

        | `username`                | User login name.                                                  |

        | `uuid`                    | Universally unique identifier.                                    |


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - account_id
      - bag_id
      - building_id
      - component_code
      - eckid
      - email_address
      - esi
      - group_code
      - group_type_code
      - identifier
      - institution_code
      - isbn
      - issn
      - kvk_organisation_id
      - kvk_establishment_id
      - leerbedrijf_id
      - offering_code
      - organisation_id
      - orcid
      - product_id
      - programme_code
      - room_code
      - schac_home
      - student_number
      - studielink_number
      - system_id
      - username
      - uuid
      - national_identity_number
      example: identifier
    type:
      type: string
      format: uri
      maxLength: 2048
      description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
      example: https://example.org/problems/bad-request
    Problem:
      type: object
      description: 'A problem details object, conforming to RFC 7807 (Problem Details for HTTP

        APIs). See https://datatracker.ietf.org/doc/html/rfc7807. It provides a

        machine-readable format for error conditions, including a type URI, title,

        status code, and optional detail and instance fields. This ensures

        consistent handling of error responses across the API.

        '
      required:
      - type
      - status
      - title
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
          description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
          example: https://example.org/problems/bad-request
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Resource not found
        status:
          type: integer
          format: int32
          description: "The HTTP status code generated by the origin server for this occurrence \nof the problem.\n"
          example: 404
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem

            '
          example: The course with id 'abc123' could not be found in the catalogue.
        instance:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          description: 'An absolute URI that identifies the specific occurrence of the problem.

            '
          example: https://api.example.org/courses/abc123
    resultValueType:
      type: string
      description: 'The result value type for this offering.


        - pass_or_fail: A simple pass or fail result.

        - insufficient_satisfactory_good: A result with three levels (insufficient, satisfactory and good).

        - us_letter: A result in the US letter grading system (A, B, C, D, F).

        - uk_letter: A result in the UK letter grading system (A, B, C, D, E, U).

        - de_grade: A result in the German grading system (1, 2, 3, 4, 5, 6).

        - grade_0_100: A result in the 0–100 grading system.

        - grade_0_10: A result in the 0–10 grading system (no decimals allowed).

        - grade_0_10_one_decimal: A result in the 0–10 grading system (with one decimal place).

        - reference_level_europass: A result in the Europass reference level grading system (A1, A2, B1, B2, C1, C2).

        - other: Any other grading system not specified above.


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - pass_or_fail
      - insufficient_satisfactory_good
      - us_letter
      - uk_letter
      - de_grade
      - grade_0_100
      - grade_0_10
      - grade_0_10_one_decimal
      - reference_level_europass
      - other
      example: grade_0_10
    AcademicSession:
      type: object
      description: 'A named period of time that can be used to communicate the various schedules and time periods an institution recognizes and uses to organise their education. AcademicSessions can be nested.

        Offerings MAY be linked to a specific AcademicSession to indicate that the specified Offering takes place during the AcademicSession, however this is not mandatory.

        '
      required:
      - academicSessionId
      - academicSessionType
      - primaryCode
      - name
      - startDateTime
      - endDateTime
      properties:
        academicSessionId:
          type: string
          description: Unique id for this academic session
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        academicSessionType:
          $ref: '#/components/schemas/academicSessionType'
        primaryCode:
          description: The primary human readable identifier for this academic session. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: identifier
            code: 2012-Q1
        name:
          type: array
          description: The name of this academic session
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: Autumn term 2020
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation or internal code used to identify this AcademicSession
          maxLength: 256
          example: SPRING-2026
        startDateTime:
          type: string
          description: The moment on which this academic session starts, RFC3339 (full-date)
          format: date-time
          example: '2025-09-28T08:30:00+01:00'
        endDateTime:
          type: string
          description: The moment on which this academic session ends, RFC3339 (full-date)
          format: date-time
          example: '2025-09-28T08:30:00+01:00'
        parentId:
          description: 'The identifier of the parent academicSession for this session (e.g. Autumn

            term 20xx where the current session is week 40).

            When the client does not request expansion of `parent`, only this

            identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        parent:
          description: 'The expanded parent academicSession object of this session (e.g. Autumn

            term 20xx where the current session is week 40).

            When the client requests expansion of `parent`, the full expanded

            academicSession object MUST be returned here instead of only the identifier.

            If no parent is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/AcademicSession'
          - type: 'null'
        childIds:
          description: "The list of identifiers of child academicSessions of this session (e.g. all\nacademic sessions in Autumn term 20xx).\nWhen the client does not request expansion of `children`, only these\nidentifiers are returned.\nThis field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).\n\nAlthough `childIds` and `children` (for example `organisationIds` versus `organisations`) may \nseem unusual, this naming is intentional and follows the singular–plural convention defined \nby the specification.\n"
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        children:
          description: 'The expanded child academicSession objects of this session (e.g. all

            academic sessions in Autumn term 20xx).

            When the client requests expansion of `children`, the full expanded

            academicSession objects MUST be returned here instead of only the identifiers.

            If no child sessions are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AcademicSession'
        yearId:
          description: 'The identifier of the top-level academicSession year for this session

            (e.g. 20xx where the current session is week 40 of a semester).

            When the client does not request expansion of `year`, only this identifier

            is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        year:
          description: 'The expanded top-level academicSession year object for this session

            (e.g. 20xx where the current session is week 40 of a semester).

            When the client requests expansion of `year`, the full expanded

            academicSession object MUST be returned here instead of only the identifier.

            If no top-level year is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/AcademicSession'
          - type: 'null'
        otherCodes:
          type:
          - array
          - 'null'
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
        consumer:
          oneOf:
          - $ref: '#/components/schemas/Consumer'
          - type: 'null'
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    costType:
      type: string
      description: "The type of cost. This is an *extensible enumeration*.\n\nThe following values are defined in the specification:\n  \n  - stap_eligible: costs for which a student may receive STAP funding\n  - total_costs: the total amount a student is required to pay to participate in this offering\n\nImplementations may add additional values beyond those listed above, provided they do not overlap in meaning with existing values.\n"
      x-ooapi-extensible-enum:
      - stap_eligible
      - total_costs
      example: total_costs
    learningOutcomeLevel:
      type: string
      description: "The level of the learning outcome. This field supports multiple frameworks for\ndescribing cognitive complexity. Two common frameworks are provided below: **Bloom’s**\nand **SOLO**. These are intended as examples — additional levels or entirely\ndifferent frameworks MAY be added as needed.\n\n**Bloom’s taxonomy** ([https://en.wikipedia.org/wiki/Bloom's_taxonomy](https://en.wikipedia.org/wiki/Bloom's_taxonomy)):\n\n| Level   | Label      | Description                                                         |\n|---------|------------|---------------------------------------------------------------------|\n| bloom_1 | Remember   | Recall facts and basic concepts (define, list, state).              |\n| bloom_2 | Understand | Explain ideas or concepts (describe, discuss, explain).             |\n| bloom_3 | Apply      | Use knowledge in new situations (implement, solve, use).            |\n| bloom_4 | Analyse    | Draw connections among ideas (differentiate, compare, examine).     |\n| bloom_5 | Evaluate   | Justify a decision or course of action (critique, assess, argue).   |\n| bloom_6 | Create     | Produce new or original work (design, construct, develop).          |\n\n**SOLO taxonomy** ([https://en.wikipedia.org/wiki/Structure_of_observed_learning_outcome](https://en.wikipedia.org/wiki/Structure_of_observed_learning_outcome)):\n\n| Level   | Label             | Description                                                     |\n|---------|-------------------|-----------------------------------------------------------------|\n| solo_0  | Prestructural     | No understanding; the student misses the point.                 |\n| solo_1  | Unistructural     | Identifies or carries out simple procedures; limited to one     |\n|         |                   | relevant aspect.                                                |\n| solo_2  | Multistructural   | Addresses several relevant aspects, but sees them as unrelated; |\n|         |                   | knowledge is additive.                                          |\n| solo_3  | Relational        | Integrates aspects into a coherent whole, showing deeper        |\n|         |                   | understanding of relationships.                                 |\n| solo_4  | Extended abstract | Generalises and applies learning to new domains, showing        |\n|         |                   | theoretical and abstract thinking.                              |\n\nThis is an *extensible enumeration*. Implementers MAY introduce other recognised\ntaxonomies, institutional or national frameworks.  \n"
      x-ooapi-extensible-enum:
      - bloom_1
      - bloom_2
      - bloom_3
      - bloom_4
      - bloom_5
      - bloom_6
      - solo_0
      - solo_1
      - solo_2
      - solo_3
      - solo_4
      example: bloom_1
    Ext:
      type: object
      description: Object for additional non-standard attributes
    levelOfQualification:
      type: string
      description: "Level of qualification according to the European Qualifications Framework (EQF).  \nSee:  \n- https://europass.europa.eu/en/description-eight-eqf-levels  \n- https://europass.europa.eu/en/europass-digital-tools/european-qualifications-framework  \n- https://nlqf.nl/\n- https://database.nlqf.nl/assets/pdf/schema-en-print.pdf\n\nThis list is extended with:\n- eqf_0: Informal or pre-qualification learning, below EQF level 1, e.g. basic literacy or life skills\n- eqf_1: Basic general knowledge and skills to carry out simple tasks\n- eqf_2: Basic factual knowledge and practical skills in a field of work or study\n- eqf_3: Knowledge of facts, principles and processes, with basic problem-solving skills\n- eqf_4: Factual and theoretical knowledge in broad contexts within a field of work or study\n- nlqf_4plus: Dutch pre-university education (VWO), considered above EQF level 4 but not formally mapped to EQF level 5\n- eqf_5: Comprehensive, specialised knowledge and practical skills, typically short-cycle higher education (e.g. associate degree)\n- eqf_6: Advanced knowledge and skills for complex problem-solving, typically bachelor level\n- eqf_7: Highly specialised knowledge and critical awareness, typically master level\n- eqf_8: Knowledge at the most advanced frontier of a field, typically doctoral level\n\nThis is an *extensible enumeration*. Use the prefix `x-` for custom values.\n"
      x-ooapi-extensible-enum:
      - eqf_0
      - eqf_1
      - eqf_2
      - eqf_3
      - eqf_4
      - nlqf_4plus
      - eqf_5
      - eqf_6
      - eqf_7
      - eqf_8
      example: eqf_6
    formalDocument:
      type: string
      description: 'The type of formal document obtained upon completion of an educational programme:


        | Code                        | Description                                    |

        |-----------------------------|------------------------------------------------|

        | `certificate`               | A formal recognition of participation or       |

        |                             | achievement                                    |

        | `diploma`                   | An official qualification awarded upon         |

        |                             | graduation                                     |

        | `micro_credential_certificate` | Formal certification specifically           |

        |                             | documenting the award of a micro-credential    |

        | `school_advice`             | Educational recommendation or guidance issued  |

        |                             | by the school                                  |

        | `testimonial`               | A written statement confirming attendance or   |

        |                             | performance                                    |

        | `no_official_document`      | No official document is issued                 |


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - certificate
      - diploma
      - micro_credential_certificate
      - school_advice
      - testimonial
      - no_official_document
      example: diploma
    PersonProperties:
      type: object
      description: A person that has a relationship with this institution
      anyOf:
      - required:
        - surname
        - primaryCode
        - activeEnrolment
      - title: With required given name
        required:
        - givenName
        - primaryCode
        - activeEnrolment
      - title: With required preferred name
        required:
        - preferredName
        - primaryCode
        - activeEnrolment
      properties:
        primaryCode:
          description: The primary human readable identifier for the person. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: studentNumber
            code: 0
        givenName:
          type:
          - string
          - 'null'
          description: The first name of this person
          maxLength: 256
          example: Martina
        alternateName:
          type:
          - string
          - 'null'
          description: The Name a person chooses to use. this is part of a Self Sovereign name e.g. in the eduId process comparable to schema.org alternateName
          maxLength: 256
          example: Marieke
        preferredName:
          type:
          - string
          - 'null'
          description: The name how the person would like to be called. Usually first name of this person. In line with ISO/IEC 24760 – Identity Management Vocabulary
          maxLength: 256
          example: Maartje
        surnamePrefix:
          type:
          - string
          - 'null'
          description: The prefix of the family name of this person
          example: van
        surname:
          type: string
          description: The family name of this person
          maxLength: 256
          example: Damme
        displayName:
          type:
          - string
          - 'null'
          description: The name of this person which will be displayed
          maxLength: 256
