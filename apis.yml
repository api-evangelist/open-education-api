- aid: open-education-api:open-education-api-groups-api
  name: Open Education API Groups API
  description: "The groups API provides information about groups that are related to\norganisations, persons\
    \ and offerings. Groups of students that are related to an\noffering are typically used for rostering.\
    \ The rostering application assigns\nstudents based on these groups. For example, class 1b will be\
    \ assigned to the\ncourse offering on Monday morning. Not all groups are related to an offering. A\n\
    group of people can also be a team that is working on a task outside the \nscope of the OEAPI. These\
    \ can be teams of students, but also teams of employees."
