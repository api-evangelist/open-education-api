- aid: open-education-api:open-education-api-programme-offering-associations-api
  name: Open Education API programme offering associations API
  description: "The programme offering associations API provides information about the association\nbetween\
    \ a programme offering and a person (e.g. students, lecturers, etc).\nAssociations can be posted between\
    \ institutions. This requires detailed information\non the programme offering and the persons. To\
    \ allow for this information a\ncomplete person object and offering object can be part of the API.\
    \ The structure\nis explained in the following model:\n<table>\n  <tr>\n   <td></td>\n   <td colspan=3\
    \ align=center>offering</td>\n  </tr>\n  <tr>\n   <td rowspan=3>student</td>\n   <td></td>\n   <!--\
    \ <td>internal</td>\n   -->\n   <td>external</td>\n  </tr>\n  <tr>\n   <td>internal</td>\n   <!--\
    \ <td>POST <a\n        href=\"#tag/offerings/paths/~1offerings~1{offeringId}~1associations~1external/post\"\
    >\n        /offerings/{offeringId}/associations/me</a> local enrolment based on\n        selected\
    \ offering\n        This call will allow for a local student using his well known credentials\n  \
    \      to enrol for the offering identified by the offeringId\n        <br>Alternatively the association\
    \ can also be created through POST\n        <a href=\"#tag/associations/paths/~1associations~1me/post\"\
    >/associations/me</a>\n       </td>\n   -->\n   <td>POST <a\n     href=\"#tag/course-offering-associations/operation/createExternalProgrammeOfferingAssociationByopenId\"\
    >\n     /programme-offering-associations/external/me</a>Retrieves student details from the well known\
    \ endpoint \n     that exposes person information at the home institution.\n     It passes offering\
    \ details (provided by\n     external institution) to the home institution so the home institution\
    \ can\n     create a placeholder for the offering and its results.\n   </td>\n  </tr>\n  <tr>\n  \
    \ <td>external</td>\n    <!--\n    <td>\n    This method is not yet implemented it requires full student\
    \ details and\n    offering details. This would mean the OEAPI message would contain more than\n \
    \   one resource in the message. At the moment the student mobility project is\n    looking into a\
    \ solution.\n    <br> Alternatively it could be achieved through using two calls:\n    <ul>\n    \
    \ <li>create student with POST\n         <a href=\"#tag/persons/paths/~1persons~1{personId}/post\"\
    >/persons</a>\n     </li>\n     <li>\n         <a href=\"#tag/offerings/paths/~1offerings~1{offeringId}~1associations~1external/post\"\
    >\n         /offerings/{offeringId}/associations/me</a>\n     </li>\n    </ul>\n    for the enrolment\n\
    \   </td>\n    -->\n   <td>no support needed</td>\n  </tr>\n</table>\nDirect update of current information:\
    \ <a\n  href=\"#tag/programme-offering-associations/operation/partialUpdateProgrammeOfferingAssociationById\"\
    >\n  PATCH /programme-offering-associations/{programmeOfferingAssociationId}</a>\nThis call is currently\
    \ limited to passing results and a remote state. For future\nuse other association resource information\
    \ could be passed. More information on\nthe support for student mobility can be found\n<a href=\"\
    https://swimlanes.io/d/s5mfpj7Si\">here</a>"
  humanURL: https://oeapi.eu/specification/v6.0/
  tags:
  - programme offering associations
