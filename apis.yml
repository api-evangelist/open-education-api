- aid: open-education-api:open-education-api-associations-api
  name: Open Education API Associations API
  description: "The associations API provides information about the association between an offering and\
    \ a person (e.g. students, lecturers, etc).\nAssociations can be posted between institutions This\
    \ requires information details on the offering and the persons.\nTo allow for this information a complete\
    \ person object and offering object can be part of the API.\nThe structure is explained in the following\
    \ model:\n<table>\n  <tr>\n   <td></td>\n   <td colspan=3 align=center>offering</td>\n  </tr>\n  <tr>\n\
    \   <td rowspan=3>student</td>\n   <td></td>\n   <!-- <td>internal</td>\n   -->\n   <td>external</td>\n\
    \  </tr>\n  <tr>\n   <td>internal</td>\n   <!-- <td>POST <a href=\"#tag/offerings/paths/~1offerings~1{offeringId}~1associations~1external/post\"\
    >/offerings/{offeringId}/associations/me</a> local enrollment based on selected offering\n    This\
    \ call will allow for a local student using his .wellknown credentials to enroll for the offering\
    \ identified by the offeringId\n    <br>Alternatively the association can also be created through\
    \ POST <a href=\"#tag/associations/paths/~1associations~1me/post\">/associations/me</a>\n   </td>\n\
    \   -->\n   <td>POST <a href=\"#tag/associations/paths/~1associations~1external~1me/post\">/associations/external/me</a>\
    \ gets student details from .wellknown at home institution. It passes offering details (provided by\
    \ external institution) to the home institution so the home institution can create a placeholder for\
    \ the offering and its results. \n   </td>\n  </tr>\n  <tr>\n   <td>external</td>\n    <!--\n    <td>\n\
    \    This method is not yet implemented it requires full student details and offering details. This\
    \ would mean the \n    OOAPI message would contain more than one resource in the message. At the moment\
    \ the student mobility project is looking into\n    a sollution.\n    <br> Alternatively it could\
    \ be achieved through using two calls:\n    <ul>\n     <li>create student with POST <a href=\"#tag/persons/paths/~1persons~1{personId}/post\"\
    >/persons</a></li>\n     <li><a href=\"#tag/offerings/paths/~1offerings~1{offeringId}~1associations~1external/post\"\
    >/offerings/{offeringId}/associations/me</a></li>\n    </ul>\n    for the enrollment\n   </td>\n \
    \   -->\n   <td>no support needed</td>\n  </tr>\n</table>\nDirect update of current information: <a\
    \ href=\"#tag/associations/paths/~1associations~1{associationId}/patch\"> PATCH /associations/{associationId}</a>\n\
    This call is currently limited to passing results and a remote state. For future use other association\
    \ resource information could be passed. \nMore information on the support for student mobility can\
    \ be found \n<a href=\"https://swimlanes.io/d/s5mfpj7Si\">here</a>"
  humanURL: https://oeapi.eu/specification/v6.0/
  tags:
  - associations
