openapi: 3.2.0
info:
  title: Open Education Courses API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged courses across 2 of this provider''s published API definitions: oeapi-6.0-rc.3.yaml, ooapi-v5.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo01.eduapi.nl/v6
  description: SURF demo implementation
- url: http://demo01.eduapi.nl/v5
  description: SURF demo implementation
tags:
- name: Courses
  description: 'The courses API provides a self-contained and formally structured learning experience,

    aimed at delivering defined learning outcomes to students, usually within the context

    of a programme.'
paths:
  /courses:
    get:
      summary: GET /courses
      operationId: listCourses
      description: Get a list of all courses, ordered by name (ascending).
      tags:
      - Courses
      parameters:
      - $ref: '#/components/parameters/primaryCode'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - name: level
        in: query
        description: Filter by level
        required: false
        schema:
          $ref: '#/components/schemas/level'
      - name: modeOfDelivery
        in: query
        description: Filter by modeOfDelivery
        required: false
        schema:
          $ref: '#/components/schemas/modeOfDelivery'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /courses/{courseId}:
    get:
      summary: GET /courses/{courseId}
      operationId: listCourseById
      description: Get a single course.
      tags:
      - Courses
      parameters:
      - name: courseId
        in: path
        description: Course ID
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        explode: false
        description: Optional properties to include, separated by a comma
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
            enum:
            - programmes
            - coordinators
            - instructors
            - organisation
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/returnTimelineOverrides'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                $ref: '#/components/schemas/CourseExpanded'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /organisations/{organisationId}/courses:
    get:
      summary: GET /organisations/{organisationId}/courses
      operationId: listCoursesByOrganisationId
      description: Get an ordered list of all courses for a given organisation, ordered by name.
      tags:
      - Courses
      parameters:
      - name: organisationId
        in: path
        description: Organisation ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - name: level
        in: query
        description: Filter by level
        required: false
        schema:
          $ref: '#/components/schemas/level'
      - name: modeOfDelivery
        in: query
        description: Filter by modeOfDelivery
        required: false
        schema:
          $ref: '#/components/schemas/modeOfDelivery'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /programmes/{programmeId}/courses:
    get:
      summary: GET /programmes/{programmeId}/courses
      operationId: listCoursesByProgrammeId
      description: Get an ordered list of all courses given through this programme.
      tags:
      - Courses
      parameters:
      - name: programmeId
        in: path
        description: Programme ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - name: level
        in: query
        description: Filter by level
        required: false
        schema:
          $ref: '#/components/schemas/level'
      - name: modeOfDelivery
        in: query
        description: Filter by modeOfDelivery
        required: false
        schema:
          $ref: '#/components/schemas/modeOfDelivery'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /courses/{courseId}/components:
    get:
      summary: GET /courses/{courseId}/components
      description: Get an ordered list of all course components.
      tags:
      - Courses
      parameters:
      - name: courseId
        in: path
        description: Course ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer_2'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage_2'
      - name: componentType
        in: query
        description: Filter by component type
        required: false
        schema:
          $ref: '#/components/schemas/componentType'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - componentId
            - name
            - -componentId
            - -name
          default:
          - componentId
          example:
          - name
          - -componentId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination_2'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Component'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest_2'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized_2'
        '403':
          $ref: '#/components/responses/ErrorForbidden_2'
        '404':
          $ref: '#/components/responses/ErrorNotFound_2'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed_2'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests_2'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError_2'
      operationId: getCoursesByCourseIdComponents
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /courses/{courseId}/offerings:
    get:
      summary: GET /courses/{courseId}/offerings
      description: Get a list of all offerings for this course, ordered chronologically.
      tags:
      - Courses
      parameters:
      - name: courseId
        in: path
        description: Course ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer_2'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage_2'
      - name: modeOfDelivery
        in: query
        description: Filter by modeOfDelivery
        required: false
        schema:
          $ref: '#/components/schemas/modesOfDelivery'
      - name: resultExpected
        in: query
        description: Filter by resultExpected
        required: false
        schema:
          type: boolean
      - name: since
        in: query
        description: Filter all offerings by providing a minimum start date for the corresponding academic session, RFC3339 (full-date). By default only future offerings are shown (equal to `?since=<today>`).
        required: false
        schema:
          type: string
          format: date
      - name: until
        in: query
        description: Filter all offerings by providing a maximum end date for the corresponding academic session, RFC3339 (full-date).
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - offeringId
            - name
            - startDate
            - endDate
            - -offeringId
            - -name
            - -startDate
            - -endDate
          default:
          - startDate
          example:
          - offeringId
          - -endDate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination_2'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/CourseOffering'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest_2'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized_2'
        '403':
          $ref: '#/components/responses/ErrorForbidden_2'
        '404':
          $ref: '#/components/responses/ErrorNotFound_2'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed_2'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests_2'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError_2'
      operationId: getCoursesByCourseIdOfferings
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
components:
  schemas:
    Consumer:
      type: object
      description: The additional elements of a consumer that may be provided, see the [documentation on support for specific consumers](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/) for further information about this mechanism.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/). This key is used to select the additional data to be presented in the request.
          type: string
          example: test-consumer
        exampleProperty:
          description: An example of an additional property
          type:
          - string
          - 'null'
          example: value-of-example-property
      additionalProperties: true
    LearningOutcome:
      type: object
      description: statements regarding what a learner knows, understands and is able to do on completion of a learning process, which are defined in terms of knowledge, skills and responsibility and autonomy (https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32017H0615(01)&from=EN)
      required:
      - learningOutcomeId
      - primaryCode
      - name
      properties:
        learningOutcomeId:
          type: string
          description: Unique id of this learning outcome
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        primaryCode:
          description: The primary human readable identifier for this learning outcome. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: learningOutcomeCode
            code: LO 2.1
        name:
          type: array
          description: The name of this learning outcome
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: 'Describe the differing views, within society, relating to the scientific uses of animals and recognize the need to respect these.

              '
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation or internal code used to identify this LearningOutcome
          maxLength: 256
          example: LO12_INFO_RET
        description:
          type:
          - array
          - 'null'
          description: The description of this learning outcome.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: "The candidate should have retained the information that they\nhave been taught and be able to:\n1. Relate opinions as voiced collectively or individually by:\n  * animal protection societies\n  * patient support societies\n  * establishments and researchers\n  * industry, including pharma, biotech and food\n  * people with personal, cultural or religious beliefs;\n2. Recognize the fundamental right of freedom of speech;\n3. Recall different perspectives which enable an individual to\n  determine their own opinion on the use of animals for scientific\n  purposes;\n4. Explain how different perspectives drive forward advancements\n  in animal welfare, legislation and science.\n(based on: https://repub.eur.nl/pub/132564/Repub_132564_O-A.pdf)\n"
        parentIds:
          description: 'The identifiers of the learning outcomes which are the parents of this learning outcome.

            When the client does not request expansion of `parents`, only these identifiers are returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        parents:
          description: 'The expanded learning outcome objects which are the parents of this learning outcome.

            When the client requests expansion of `parents`, the full expanded learning outcome objects MUST be returned here instead of only the identifiers.

            If no parents are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/LearningOutcome'
            - type: 'null'
        childIds:
          description: "The identifiers of all learning outcomes for which this learning outcome is the parent.\nWhen the client does not request expansion of `children`, only these identifiers are returned.\nThis field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).\n\nAlthough `childIds` and `children` (for example `organisationIds` versus `organisations`) may \nseem unusual, this naming is intentional and follows the singular–plural convention defined \nby the specification.\n"
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        children:
          description: 'The expanded learning outcome objects for which this learning outcome is the parent.

            When the client requests expansion of `children`, the full expanded learning outcome objects MUST be returned here instead of only the identifiers.

            If no children are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/LearningOutcome'
            - type: 'null'
        fieldsOfStudy:
          type:
          - string
          - 'null'
          description: "Field(s) of study (e.g. ISCED-F) (https://unesdoc.unesco.org/ark:/48223/pf0000228085.locale=en). \nISCED-F categorizes the fields of study 2 digits at root level and further subdivision as more digits are added.\nPreferably fieldsOfStudy contains at least 4 digits.\nISCEDF2013vSOI2021 currently allows for 6 digits max (https://www.cbs.nl/-/media/cbs/onze-diensten/methoden/classificaties/documents/2025/pubsoi2021_ed2425.pdf).\n07 Engineering, manufacturing and construction\n073 Architecture and construction\n0731 Architecture and town planning\n073101 Town planning\n"
          minLength: 2
          maxLength: 6
          example: '0732'
        otherCodes:
          type:
          - array
          - 'null'
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
        complexityLevel:
          oneOf:
          - $ref: '#/components/schemas/learningOutcomeLevel'
          - type: 'null'
        validFrom:
          type:
          - string
          - 'null'
          description: The date and time for when this learning outcome will be active. Should be a string formatted as an RFC3099 full-date.
          format: date-time
          example: '2025-09-01T09:00:00+01:00'
        validTo:
          type:
          - string
          - 'null'
          description: The date and time when this learning outcome will no longer be valid, or should be renewed. Should be a string formatted as an RFC3099 full-date.
          format: date-time
          example: '2025-09-01T09:00:00+01:00'
        consumer:
          oneOf:
          - $ref: '#/components/schemas/Consumer'
          - type: 'null'
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    type:
      type: string
      format: uri
      maxLength: 2048
      description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
      example: https://example.org/problems/bad-request
    TimelineOverrideCourse:
      type: object
      required:
      - validFrom
      - course
      description: A timeline override of the course.
      properties:
        validFrom:
          type: string
          description: The day on which this timelineOverride starts (inclusive), RFC3339 (date)
          format: date-time
          example: '2025-09-01T08:30:00+01:00'
        validTo:
          type:
          - string
          - 'null'
          description: The day on which this timelineOverride ends (exclusive), RFC3339 (date)
          format: date-time
          example: '2025-11-30T08:30:00+01:00'
        course:
          $ref: '#/components/schemas/CourseProperties'
    qualificationAwarded:
      type: string
      description: 'Type of qualification that can be obtained upon completing the programme:

        - diploma

        - vocational_diploma

        - certificate

        - associate_degree: Associate degree — short-cycle higher education qualification (EQF level 5)

        - bachelor: Bachelor — undergraduate degree (EQF level 6)

        - master: Master — postgraduate degree (EQF level 7)

        - doctoral: Doctoral degree — research-based doctoral degree (EQF level 8)

        - none: No formal qualification is awarded for this programme


        In case of a degree (for example bachelor or master), the type of degree can be specified using `qualificationDesignations`.

        '
      x-ooapi-extensible-enum:
      - diploma
      - vocational_diploma
      - certificate
      - associate_degree
      - bachelor
      - master
      - doctoral
      - none
      example: none
    Nationality:
      type: object
      description: 'An object indicating nationality based on at least one iso-3166 code. In situations where more than one iso-3166 code is provided the codes have address the same country.

        '
      properties:
        iso3166-1-alpha2:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
          example: NL
        iso3166-1-alpha3:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3
          example: NLD
        iso3166-3:
          type:
          - string
          - 'null'
          minLength: 4
          maxLength: 4
          description: 'A nationality code for a country that no longer exists on https://en.wikipedia.org/wiki/ISO_3166-3 It is not advised to use the original iso3166-1 for such a country since country codes can get reassigned to new countries ones the original country code is officially obsolete. It is possible that a person has a nationality of a country that does not exist any more (after a country got split up like CZ and YU)\ and never applied for nationality of one of the new countries.

            '
          example: ANHH
    Address:
      type: object
      description: The full street address
      required:
      - addressType
      properties:
        addressType:
          $ref: '#/components/schemas/addressType'
        street:
          type:
          - string
          - 'null'
          description: The street name
          example: Moreelsepark
        streetNumber:
          type:
          - string
          - 'null'
          description: The street number
          example: '48'
        additional:
          type:
          - array
          - 'null'
          description: Further details like building name, suite, apartment number, etc.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: On the other side of the road
        postCode:
          type:
          - string
          - 'null'
          description: Code to help sort and deliver mail also known as Postal code and ZIP code
          example: 3511 EP
        city:
          type:
          - string
          - 'null'
          description: name of the city / locality
          example: Utrecht
        countryCode:
          oneOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        geolocation:
          type:
          - object
          - 'null'
          description: Geolocation of the entrance of this address (WGS84 coordinate reference system)
          required:
          - latitude
          - longitude
          properties:
            latitude:
              type: number
              format: double
              example: 52.089123
            longitude:
              type: number
              format: double
              example: 5.113337
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    PersonId:
      type: object
      properties:
        personId:
          type: string
          description: Unique id of this person
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - personId
    Language:
      description: 'The language used in the described entity. The value **must be a language tag that conforms to RFC 5646** (Tags for Identifying Languages, BCP 47):

        https://www.rfc-editor.org/rfc/rfc5646.html


        A tag consists of the following components, in this exact order:

        1. **language** – two‑ to three‑letter codes (ISO 639‑1/‑2) **or** four‑letter codes (ISO 639‑5) **or** five‑ to eight‑letter registered language subtags.

        2. **script** – optional, four letters in Title‑Case (e.g. `Latn`, `Hant`).

        3. **region** – optional, either two uppercase letters (ISO 3166‑1) **or** three digits (UN M.49).

        4. **variant** – zero or more subtags, each either five‑ to eight‑alphanumerics or a digit followed by three alphanumerics (e.g. `1901`, `oxendict`).

        5. **extension** – zero or more extensions. Each extension starts with a *singleton* (a single alphanumeric character except `x`) followed by one or more subtags of two‑ to eight‑alphanumerics (e.g. `u‑co‑phonebk`).

        6. **private‑use** – optional, the letter `x` followed by one or more subtags of one‑ to eight‑alphanumerics (e.g. `x‑private`).


        The most common form is a two‑letter language code (ISO 639‑1) optionally followed by a hyphen and a two‑letter country code (ISO 3166‑1), for example `en` or `en‑GB`.


        More specific tags are also valid, for instance `zh‑Hant‑TW` (Traditional Chinese as used in Taiwan).


        For sign languages two conventions are recognised:

        * `sgn` – e.g. `nl‑sgn‑NL` (Dutch Sign Language)

        * `s`   – e.g. `nl‑s‑NL` (Dutch Sign Language)

        '
      type: string
      minLength: 2
      pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,2}|[A-Za-z]{4}|[A-Za-z]{5,8})(?:-[A-Za-z]{4})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*?(?:-(?:[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+))*?(?:-x(?:-[A-Za-z0-9]{1,8})+)?|x(?:-[A-Za-z0-9]{1,8})+)$
      example: en-GB
