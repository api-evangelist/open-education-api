openapi: 3.2.0
info:
  title: Open Education education specifications API
  version: 5.0.0
  x-logo:
    url: ../logo.png
  description: 'Operations tagged education specifications across 2 of this provider''s published API definitions: ooapi-v5.yaml, open-education-api-v5-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://demo01.eduapi.nl/v5
  description: SURF demo implementation
tags:
- name: education specifications
  description: 'The education specification API provides information on the specification of an education object.

    This specification allows for other education objects to be derived from it.

    It is used to aggregate education objects from a supplying institution.

    It clusters programs to a main educationSpecification that is used in registries such as RIO.'
paths:
  /education-specifications:
    get:
      summary: GET /education-specifications
      description: Get a list of all education specifications, ordered by name (ascending).
      tags:
      - education specifications
      parameters:
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - name: educationSpecificationType
        in: query
        description: Filter by type of education specification
        required: false
        schema:
          $ref: '#/components/schemas/educationSpecificationType'
      - name: primaryCode
        in: query
        description: Filter by primary code of education specification
        required: false
        schema:
          type: string
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - educationSpecificationType
            - name
            - primaryCode
            - -educationSpecificationType
            - -name
            - -primaryCode
          default:
          - - name
          example:
          - educationSpecificationType
          - -primaryCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/EducationSpecification'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getEducationSpecifications
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /education-specifications/{educationSpecificationId}:
    get:
      summary: GET /education-specifications/{educationSpecificationId}
      description: Get a single education specification.
      tags:
      - education specifications
      parameters:
      - name: educationSpecificationId
        in: path
        description: Education specification ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/returnTimelineOverrides'
      - name: expand
        in: query
        explode: false
        description: Optional properties to include, separated by a comma
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - parent
            - children
            - organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - title: Without timelineOverrides (default)
                  $ref: '#/components/schemas/EducationSpecification'
                - title: With timelineOverrides
                  $ref: '#/components/schemas/EducationSpecificationExpanded'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getEducationSpecificationsByEducationSpecificationId
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /education-specifications/{educationSpecificationId}/education-specifications:
    get:
      summary: GET /education-specifications/{educationSpecificationId}/education-specification…
      description: Get an ordered list of all education-specifications given through this educationspecification.
      tags:
      - education specifications
      parameters:
      - name: educationSpecificationId
        in: path
        description: Education Specification ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - educationSpecificationId
            - name
            - educationSpecificationType
            - -educationSpecificationId
            - -name
            - -educationSpecificationType
          default:
          - educationSpecificationId
          example:
          - educationSpecificationId
          - -name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getEducationSpecificationsByEducationSpecificationIdEducationSpecifications
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /education-specifications/{educationSpecificationId}/courses:
    get:
      summary: GET /education-specifications/{educationSpecificationId}/courses
      description: Get an ordered list of all courses given through this EducationSpecification.
      tags:
      - education specifications
      parameters:
      - name: educationSpecificationId
        in: path
        description: Education Specification ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - name: level
        in: query
        description: Filter by level
        required: false
        schema:
          $ref: '#/components/schemas/level'
      - name: modeOfDelivery
        in: query
        description: Filter by modeOfDelivery
        required: false
        schema:
          $ref: '#/components/schemas/modesOfDelivery'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - courseId
            - name
            - -courseId
            - -name
          default:
          - courseId
          example:
          - courseId
          - -name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Course'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getEducationSpecificationsByEducationSpecificationIdCourses
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /education-specifications/{educationSpecificationId}/programs:
    get:
      summary: GET /education-specifications/{educationSpecificationId}/programs
      description: Get an ordered list of all programs for a given education specification, ordered by name.
      tags:
      - education specifications
      parameters:
      - name: educationSpecificationId
        in: path
        description: Education Specification ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/teachingLanguage'
      - name: programType
        in: query
        description: Filter by program type
        required: false
        schema:
          $ref: '#/components/schemas/programType'
      - name: qualificationAwarded
        in: query
        description: Filter by qualificationAwarded
        required: false
        schema:
          $ref: '#/components/schemas/qualificationAwarded'
      - name: levelOfQualification
        in: query
        description: Filter by levelOfQualification
        required: false
        schema:
          $ref: '#/components/schemas/levelOfQualification'
      - name: sector
        in: query
        description: Filter by sector
        required: false
        schema:
          $ref: '#/components/schemas/sector'
      - name: fieldsOfStudy
        in: query
        description: Filter by fieldsOfStudy
        required: false
        schema:
          type: string
      - name: croho-creboCode
        in: query
        description: Filter by croho-creboCode
        required: false
        schema:
          type: string
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - programId
            - name
            - -programId
            - -name
          default:
          - name
          example:
          - programId
          - -name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Program'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getEducationSpecificationsByEducationSpecificationIdPrograms
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
components:
  parameters:
    consumer:
      name: consumer
      in: query
      description: Request entities meant for a specific consumer. This query parameter is independent from the `consumers` attribute. See the [documentation on support for specific consumers](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information about this mechanism.
      required: false
      schema:
        type: string
    teachingLanguage:
      name: teachingLanguage
      in: query
      description: Filter by teachingLanguage, which is a string describing the main teaching language, should be a three-letter language code as specified by ISO 639-2.
      required: false
      schema:
        type: string
        pattern: ^[a-z]{3}$
        minLength: 3
        maxLength: 3
      example: nld
    pageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        enum:
        - 10
        - 20
        - 50
        - 100
        - 250
    search:
      name: q
      in: query
      description: Filter by items having a name, abbreviation or description containing the given search term (exact partial match, case insensitive)
      required: false
      schema:
        type: string
    pageNumber:
      name: pageNumber
      in: query
      description: The page number to get. Page numbers start at 1.
      required: false
      schema:
        type: integer
        format: int32
        example: 1
        minimum: 1
    returnTimelineOverrides:
      name: returnTimelineOverrides
      in: query
      description: Controls whether the attribute `timelineOverrides` is returned or not. The default is `false`, so this has to explicitly set to `true` if a client needs the timeline overrides. See [GET /education-specifications/{educationSpecificationId}](#tag/education-specifications/paths/~1education-specifications~1{educationSpecificationId}/get) for an example.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    sector:
      type: string
      description: 'The sector for this program

        - secondary vocational education: middelbaar beroepsonderwijs

        - higher professional education: hoger beroepsonderwijs

        - university education: universitair onderwijs

        '
      enum:
      - secondary vocational education
      - higher professional education
      - university education
      example: university education
    programType:
      type: string
      description: 'The type of this program

        - program: opleiding

        - minor: minor

        - honours: honours

        - specialization: specialisatie

        - track: track

        '
      enum:
      - program
      - minor
      - honours
      - specialization
      - track
      example: program
    Consumer:
      type: object
      description: Object for communicating data to a specific consumer (destination). This object has no relationship with the `consumer` query parameter.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information.
          type: string
      additionalProperties: true
    personAffiliations:
      type: array
      description: 'The affiliations of this person, the relations a person has with the organization providing this endpoint

        - student: student

        - employee: medewerker

        - guest: gast

        '
      items:
        type: string
        enum:
        - student
        - employee
        - guest
        example: student
    codeType:
      type: string
      description: "The code/identifier type. \n\nThis is an *extensible enumeration*. Use `x-` to prefix custom values\n\nThe predefined values are:\n  - `brin`: The registration number for a Dutch educational institution that is issued by the Dutch Ministry of Education, Culture and Science\n  - `crohoCreboCode`: programs with a CREBO and CROHO number are accredited by the Dutch Ministry of Education, Culture and Science (OCW)\n  - `programCode`: Identifier for the program (collection of courses)\n  - `componentCode`: The code for a component (part of a course)\n  - `offeringCode`: The code to identify a specific offering (program, course or component offering)\n  - `organizationId`: The identifier for the organization\n  - `buildingId`: The number or code to identify a building\n  - `bagId`: The identification of a building as it is known in the Dutch Building Administration (BAG)\n  - `roomCode`: The code for a room\n  - `systemId`: Identifier assigned to an entity in context of a specific system\n  - `productId`: Identifier assigned to a specific product\n  - `nationalIdentityNumber`: Identifier assigned by the governement of the person. e.g. a social security number in the USA\n  - `studentNumber`: Identifier for the student\n  - `studielinkNumber`: Identifier for the person as determined by Studielink\n  - `esi`: European Student Identifier\n  - `userName`: The name of a user\n  - `accountId`: Identifier assigned to a specific account\n  - `emailAdress`: An email address\n  - `groupCode`: The identifier for a group (of persons)\n  - `isbn`: International Standard Book Number that serve as product identifiers for Books\n  - `issn`: International Standard Book Number that serve as product identifiers for periodicals\n  - `orcId`: Open Researcher and Contributor ID\n  - `uuid`: A universally unique identifier\n  - `schacHome`: Home organization using the domain name of the organization\n  - `identifier`: Generic Identifier\n"
      x-ooapi-extensible-enum:
      - brin
      - crohoCreboCode
      - programCode
      - componentCode
      - offeringCode
      - organizationId
      - buildingId
      - bagId
      - roomCode
      - systemId
      - productId
      - nationalIdentityNumber
      - studentNumber
      - studielinkNumber
      - esi
      - userName
      - accountId
      - emailAdress
      - groupCode
      - isbn
      - issn
      - orcId
      - uuid
      - schacHome
      - identifier
      example: identifier
    CourseId:
      type: object
      description: An object describing the metadata of a course
      required:
      - courseId
      properties:
        courseId:
          type: string
          description: Unique id of this course
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
    Problem:
      type: object
      description: A system message including the error code and an explanation
      required:
      - status
      - title
      properties:
        status:
          type: string
          description: The HTTP status code
          example: '404'
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Resource not found
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
    EducationSpecificationProperties:
      type: object
      description: "The specification of an education object. This specification allows for other education objects to be derived from it.\nIt is used to aggregate education objects from a supplying institution.\nIt clusters programs to a main educationSpecification that is used in registries such as RIO. \n"
      required:
      - primaryCode
      - educationSpecificationType
      - name
      properties:
        primaryCode:
          description: "The primary human readable identifier for the entity. \nThis will often take the form of a human readable code as defined by the institution or region\n"
          $ref: '#/components/schemas/IdentifierEntry'
        otherCodes:
          type: array
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
          example:
          - codeType: crohoCreboCode
            code: '1234123'
        educationSpecificationType:
          $ref: '#/components/schemas/educationSpecificationType'
        name:
          type: array
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          description: The name of this education specification
          example:
          - language: en-GB
            value: Bachelor Chemical technology
        abbreviation:
          type: string
          description: The abbreviation of this program
          maxLength: 256
          example: B Scheikundige Technologie
        description:
          type: array
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          description: The description of this program. [The limited implementation of Git Hub Markdown syntax](#tag/formatting-and-displaying-results-from-API) MAY be used for rich text representation.
          example:
          - language: en-GB
            value: program that is a place holder for all courses that are made available for student mobility
        formalDocument:
          $ref: '#/components/schemas/formalDocument'
        level:
          $ref: '#/components/schemas/level'
        sector:
          $ref: '#/components/schemas/sector'
        levelOfQualification:
          $ref: '#/components/schemas/levelOfQualification'
        fieldsOfStudy:
          type: string
          description: Field(s) of study (e.g. ISCED-F) (https://unesdoc.unesco.org/ark:/48223/pf0000228085.locale=en).
          maxLength: 4
          example: '0732'
        studyLoad:
          $ref: '#/components/schemas/StudyLoadDescriptor'
        learningOutcomes:
          type: array
          description: Statements that describe the knowledge or skills students should acquire by the end of a particular course or program (ECTS-learningoutcome).
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/LanguageTypedString'
            example:
            - language: en-GB
              value: 'Executable knowledge of Chemical technology, including: Acquire knowledge of research paradigms.'
        link:
          type: string
          description: URL of the program's website
          format: uri
          maxLength: 2048
          example: https://bijvak.nl
        parent:
          description: The educationSpecification that is the parent of this educationSpecification if it exists. [`expandable`](#tag/education_specification_model)
          oneOf:
          - $ref: '#/components/schemas/Identifier'
            title: educationSpecificationId
          - $ref: '#/components/schemas/EducationSpecification'
            title: EducationSpecification
        children:
          type: array
          description: The EducationSpecifications that have this EducationSpecification as their parent. [`expandable`](#tag/education_specification_model)
          items:
            oneOf:
            - $ref: '#/components/schemas/Identifier'
              title: educationSpecificationId
            - $ref: '#/components/schemas/EducationSpecification'
              title: EducationSpecification
        organization:
          description: 'The organization that manages this group. [`expandable`](#tag/organization_model)

            By default only the `organizationId` (a string) is returned. If the client requested an expansion of `organization` the full organization object should be returned.

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
            title: organizationId
          - $ref: '#/components/schemas/Organization'
            title: Organization object
        consumers:
          description: The additional consumer elements that can be provided, see the [documentation on support for specific consumers](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information about this mechanism.
          type: array
          items:
            $ref: '#/components/schemas/Consumer'
          example:
          - consumerKey: rio
            educationSpecificationSubType: variant
            category:
            - business_and_project_support
            - economy
        ext:
          $ref: '#/components/schemas/Ext'
    modesOfDelivery:
      type: array
      description: 'The mode of delivery of the component (ECTS-mode of delivery)

        - distance-learning: afstandsleren

        - on campus: op de campus

        - online: online

        - hybrid: hybride

        - situated: op locatie

        '
      items:
        type: string
        enum:
        - distance-learning
        - on campus
        - online
        - hybrid
        - situated
        example: situated
    EducationSpecification:
      allOf:
      - $ref: '#/components/schemas/EducationSpecificationId'
      - $ref: '#/components/schemas/EducationSpecificationProperties'
      - properties:
          validFrom:
            description: The first day this EducationSpecification is valid (inclusive).
            type: string
            format: date
          validTo:
            description: The day this EducationSpecification ceases to be valid (e.g. exclusive).
            type: string
            format: date
    ProgramId:
      type: object
      description: A collection of courses that lead to a certifiable learning outcome
      required:
      - programId
      properties:
        programId:
          type: string
          description: Unique id for this program
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
    Ext:
      type: object
      description: Object for additional non-standard attributes
    levelOfQualification:
      type: string
      description: Level of qualification according to the Dutch National Qualification Framework and the European Qualifications Framework, see [this overview](https://nlqf.nl/images/downloads/English2018/Schematic_overview_NLQF_2020.pdf) for more information.
      enum:
      - '1'
      - '2'
      - '3'
      - '4'
      - 4+
      - '5'
      - '6'
      - '7'
      - '8'
      example: '6'
    formalDocument:
      type: string
      description: "The type of formal document obtained after completion of this education\n  - diploma: DIPLOMA\n  - certificate: CERTIFICAAT\n  - no official document: GEEN OFFICIEEL DOCUMENT\n  - testimonial: GETUIGSCHRIFT\n  - school advice: SCHOOLADVIES\n"
      enum:
      - diploma
      - certificate
      - no official document
      - testimonial
      - school advice
      example: diploma
    PersonProperties:
      type: object
      description: A person that has a relationship with this institution
      required:
      - givenName
      - surname
      - displayName
      - affiliations
      - mail
      - primaryCode
      - activeEnrollment
      properties:
        primaryCode:
          description: The primary human readable identifier for the person. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: studentNumber
