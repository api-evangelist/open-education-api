openapi: 3.2.0
info:
  version: 6.0-rc.3
  title: Open Education Organisations API
  description: OpenAPI (fka Swagger) specification for the Open Education API.
  license:
    name: EUPL-1.2
    url: https://github.com/open-education-api/specification/blob/release/6.0/LICENSE.md
  contact:
    name: OEAPI Working Group / SURF
    url: https://oeapi.eu
    email: info@oeapi.eu
  x-logo:
    url: ./logo.png
    href: ./docs.html
servers:
- url: https://demo01.eduapi.nl/v6
  description: SURF demo implementation
security: []
tags:
- name: Organisations
  description: 'The organisations API provides the organisations that are responsible for the

    execution and recognition of education, either as an educational institution or

    as an organisation providing services, internships or facilities.'
paths:
  /organisations:
    get:
      summary: GET /organisations
      operationId: listOrganisations
      description: Get an ordered list of all organisations, ordered by name.
      tags:
      - Organisations
      parameters:
      - $ref: '#/components/parameters/primaryCode'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/search'
      - name: organisationType
        in: query
        description: Filter by organisation type
        required: false
        schema:
          $ref: '#/components/schemas/organisationType'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organisation'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
  /organisations/{organisationId}:
    get:
      summary: GET /organisations/{organisationId}
      operationId: listOrganisationById
      description: Get a single organisation.
      tags:
      - Organisations
      parameters:
      - name: organisationId
        in: path
        description: Organisation ID
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        explode: false
        description: Optional properties to expand, separated by a comma
        required: false
        style: form
        schema:
          type: array
          items:
            type: string
            enum:
            - parent
            - children
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    put:
      summary: PUT /organisations/{organisationId}
      operationId: replaceOrganisationById
      description: change the data of a single organisation.
      tags:
      - Organisations
      parameters:
      - name: organisationId
        in: path
        description: Organisation ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/vnd.oeapi+json:
            schema:
              $ref: '#/components/schemas/Organisation'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
components:
  schemas:
    Consumer:
      type: object
      description: The additional elements of a consumer that may be provided, see the [documentation on support for specific consumers](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/) for further information about this mechanism.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/). This key is used to select the additional data to be presented in the request.
          type: string
          example: test-consumer
        exampleProperty:
          description: An example of an additional property
          type:
          - string
          - 'null'
          example: value-of-example-property
      additionalProperties: true
    type:
      type: string
      format: uri
      maxLength: 2048
      description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
      example: https://example.org/problems/bad-request
    Address:
      type: object
      description: The full street address
      required:
      - addressType
      properties:
        addressType:
          $ref: '#/components/schemas/addressType'
        street:
          type:
          - string
          - 'null'
          description: The street name
          example: Moreelsepark
        streetNumber:
          type:
          - string
          - 'null'
          description: The street number
          example: '48'
        additional:
          type:
          - array
          - 'null'
          description: Further details like building name, suite, apartment number, etc.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: On the other side of the road
        postCode:
          type:
          - string
          - 'null'
          description: Code to help sort and deliver mail also known as Postal code and ZIP code
          example: 3511 EP
        city:
          type:
          - string
          - 'null'
          description: name of the city / locality
          example: Utrecht
        countryCode:
          oneOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        geolocation:
          type:
          - object
          - 'null'
          description: Geolocation of the entrance of this address (WGS84 coordinate reference system)
          required:
          - latitude
          - longitude
          properties:
            latitude:
              type: number
              format: double
              example: 52.089123
            longitude:
              type: number
              format: double
              example: 5.113337
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    Language:
      description: 'The language used in the described entity. The value **must be a language tag that conforms to RFC 5646** (Tags for Identifying Languages, BCP 47):

        https://www.rfc-editor.org/rfc/rfc5646.html


        A tag consists of the following components, in this exact order:

        1. **language** – two‑ to three‑letter codes (ISO 639‑1/‑2) **or** four‑letter codes (ISO 639‑5) **or** five‑ to eight‑letter registered language subtags.

        2. **script** – optional, four letters in Title‑Case (e.g. `Latn`, `Hant`).

        3. **region** – optional, either two uppercase letters (ISO 3166‑1) **or** three digits (UN M.49).

        4. **variant** – zero or more subtags, each either five‑ to eight‑alphanumerics or a digit followed by three alphanumerics (e.g. `1901`, `oxendict`).

        5. **extension** – zero or more extensions. Each extension starts with a *singleton* (a single alphanumeric character except `x`) followed by one or more subtags of two‑ to eight‑alphanumerics (e.g. `u‑co‑phonebk`).

        6. **private‑use** – optional, the letter `x` followed by one or more subtags of one‑ to eight‑alphanumerics (e.g. `x‑private`).


        The most common form is a two‑letter language code (ISO 639‑1) optionally followed by a hyphen and a two‑letter country code (ISO 3166‑1), for example `en` or `en‑GB`.


        More specific tags are also valid, for instance `zh‑Hant‑TW` (Traditional Chinese as used in Taiwan).


        For sign languages two conventions are recognised:

        * `sgn` – e.g. `nl‑sgn‑NL` (Dutch Sign Language)

        * `s`   – e.g. `nl‑s‑NL` (Dutch Sign Language)

        '
      type: string
      minLength: 2
      pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,2}|[A-Za-z]{4}|[A-Za-z]{5,8})(?:-[A-Za-z]{4})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*?(?:-(?:[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+))*?(?:-x(?:-[A-Za-z0-9]{1,8})+)?|x(?:-[A-Za-z0-9]{1,8})+)$
      example: en-GB
    Organisation:
      type: object
      description: A description of a group of people working together to achieve a goal
      required:
      - organisationId
      - organisationType
      - name
      - primaryCode
      properties:
        organisationId:
          type: string
          description: Unique id of this organisation
          format: uuid
          example: 123e4567-e89b-12d3-a456-123514174000
        primaryCode:
          description: The primary human readable identifier for the organisation. This is often the source identifier as defined by the root organisation.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: organisation_id
            code: Org01-Root
        organisationType:
          $ref: '#/components/schemas/organisationType'
        name:
          type: array
          description: The name of the organisation
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: nl-NL
            value: Coöperatie SURF U.A.
        shortName:
          type:
          - string
          - 'null'
          description: Short name of the organisation
          maxLength: 256
          example: SURF
        description:
          type:
          - array
          - 'null'
          description: "If the organisation is an educational organisation, any general description should clearly mention the type of \neducation organisation, especially in the case of a binary system. In Dutch; universiteit (university) or \nhogeschool (university of applied sciences).\nIf the organisation is not an educational organisation, a general description should describe the role it plays \nin education like providing certain types of internships, educational services, products or facilities.\n"
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: nl-NL
            value: SURF is een coöperatieve vereniging van Nederlandse onderwijs- en onderzoeksinstellingen waarin de leden hun krachten bundelen. De leden zijn eigenaar van SURF.
        addresses:
          type:
          - array
          - 'null'
          description: Addresses of this organisation
          items:
            $ref: '#/components/schemas/Address'
        link:
          type:
          - string
          - 'null'
          description: URL of the organisation's website
          format: uri
          maxLength: 2048
          example: https://surf.nl
        logo:
          type:
          - string
          - 'null'
          description: Logo of this organisation
          format: uri
          maxLength: 2048
          example: https://www.surf.nl/themes/surf/logo.svg
        otherCodes:
          type:
          - array
          - 'null'
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
          example:
          - codeType: institution_code
            code: 114B529
          - codeType: kvk_organisation_id
            code: '50277374'
        rootId:
          description: 'The identifier of the organisation which is the root organisation of this organisation.

            When the client does not request expansion of `root`, only this identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        root:
          description: 'The expanded organisation object which is the root organisation of this organisation.

            When the client requests expansion of `root`, the full expanded organisation object MUST be returned here instead of only the identifier.

            If no root organisation is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        parentId:
          description: 'The identifier of the organisational unit which is the parent of this organisation.

            When the client does not request expansion of `parent`, only this identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        parent:
          description: 'The expanded organisation object which is the parent of this organisation.

            When the client requests expansion of `parent`, the full expanded organisation object MUST be returned here instead of only the identifier.

            If no parent organisation is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        childIds:
          description: "The identifiers of the organisational units for which this organisation is the parent.\nWhen the client does not request expansion of `children`, only these identifiers are returned.\nThis field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).\n\nAlthough `childIds` and `children` (for example `organisationIds` versus `organisations`) may \nseem unusual, this naming is intentional and follows the singular–plural convention defined \nby the specification.\n"
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        children:
          description: 'The expanded organisational unit objects for which this organisation is the parent.

            When the client requests expansion of `children`, the full expanded organisation objects MUST be returned here instead of only the identifiers.

            If no children are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/Organisation'
            - type: 'null'
        consumer:
          oneOf:
          - $ref: '#/components/schemas/Consumer'
          - type: 'null'
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    organisationType:
      type: string
      description: 'The type of this organisation. When using non-root organisation types, make sure that there is always a parent organisation of type root available.


        - root: The top-level organisation, representing the organisation itself

        - institute: A subdivision of the root organisation, typically focused on a broad field of study

        - department: An organisational unit within an organisation or one of the subdivisions of an organisation, focused on a specific discipline

        - faculty: A major academic division within an institution, often overseeing multiple departments

        - branch: A geographically separate location or campus of an organisation

        - academy: A specialised academic unit, often focused on applied or artistic disciplines

        - school: An organisational unit typically used in primary, secondary, or specialised higher education contexts


        This is an extensible enumeration. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - root
      - institute
      - department
      - faculty
      - branch
      - academy
      - school
      example: root
    ProblemVersionNotAcceptable:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - requestedVersion
        - supportedVersions
        properties:
          type:
            $ref: '#/components/schemas/type'
          title:
            $ref: '#/components/schemas/title'
          consumer:
            description: 'Indicates which party caused the version mismatch. When null, the 406 was

              triggered by an unsupported OEAPI version. If populated with a Consumer

              object, the 406 was caused by a consumer-specific version that did not match

              any supported version. This field MAY contain a full Consumer object or be

              null.

              '
            oneOf:
            - $ref: '#/components/schemas/Consumer'
            - type: 'null'
          requestedVersion:
            type: string
            description: The version requested by the client.
            example: '5.0'
          supportedVersions:
            type: array
            description: Versions the server can serve, typically in descending order.
            items:
              type: string
            example:
            - '4.2'
            - '4.1'
    Ext:
      type: object
      description: Object for additional non-standard attributes
    Pagination:
      type: object
      required:
      - pageSize
      - pageNumber
      - hasPreviousPage
      - hasNextPage
      properties:
        pageSize:
          type: integer
          format: int32
          description: The number of items per page
          example: 10
        pageNumber:
          type: integer
          format: int32
          description: The current page number
          example: 1
          minimum: 1
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page
          example: false
        hasNextPage:
          type: boolean
          description: Whether there is a previous page
          example: true
        totalPages:
          type:
          - integer
          - 'null'
          format: int32
          description: Total number of pages
          example: 8
    Country:
      type: object
      description: 'An object indicating a country based on at least one iso-3166 code. In situations where more than one ISO-3166 code is provided, the codes must refer to the same country.

        '
      properties:
        iso3166-1-alpha2:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
          example: NL
        iso3166-1-alpha3:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3
          example: NLD
        iso3166-2:
          type:
          - string
          - 'null'
          minLength: 5
          maxLength: 6
          description: A country subdivision code based on https://en.wikipedia.org/wiki/ISO_3166-2
          example: BQ-BO
        iso3166-3:
          type:
          - string
          - 'null'
          minLength: 4
          maxLength: 4
          description: 'A code for a country that no longer exists is listed on ISO 3166-3 (https://en.wikipedia.org/wiki/ISO_3166-3).

            Implementations should refrain from using the original ISO 3166-1 code for such a country since country codes

            can be reassigned to new countries once the original country code is officially declared obsolete.

            '
          example: ANHH
    addressType:
      type: string
      description: "The type of address, indicating its intended use:\n  \n- postal: Used for receiving post\n- visit: Used for physical visits\n- deliveries: Used for deliveries\n- invoicing: Used for invoicing purposes\n- teaching: The location where educational activities take place\n\nThis is an *extensible enumeration*. Use the prefix `x-` for custom values.\n"
      x-ooapi-extensible-enum:
      - postal
      - visit
      - deliveries
      - invoicing
      - teaching
      example: postal
    codeType:
      type: string
      description: 'The type of code or identifier.


        The predefined values are:


        | Code                      | Description                                                       |

        |---------------------------|-------------------------------------------------------------------|

        | `account_id`              | Identifier for an account.                                        |

        | `bag_id`                  | Identifier for a building in the Dutch Building and Address       |

        |                           | Registry (BAG).                                                   |

        | `building_id`             | Identifier for a building.                                        |

        | `component_code`          | Identifier for a component (part of a course).                    |

        | `eckid`                   | Identifier assigned within the Dutch *Educatieve ContentKeten iD* |

        |                           | framework. It enables persistent identification and exchange of   |

        |                           | digital learning resources within the Dutch educational sector for|

        |                           | EQF levels 1, 2, 3 and 4. Comparable international approaches     |

        |                           | include LRMI, DOI and Handle                                      |

        |                           | identifiers for learning resources.                               |

        | `email_address`           | An email address.                                                 |

        | `esi`                     | European Student Identifier.                                      |

        | `group_code`              | Identifier for a group of people.                                 |

        | `group_type_code`         | Identifier for the type of group.                                 |

        | `identifier`              | Generic identifier.                                               |

        | `institution_code`        | Registration number of an educational institution. In the         |

        |                           | Netherlands, the former BRIN code has been replaced by the        |

        |                           | institution code, issued by the Ministry of Education, Culture    |

        |                           | and Science (OCW).                                                |

        | `isbn`                    | International Standard Book Number (for books).                   |

        | `issn`                    | International Standard Serial Number (for periodicals).           |

        | `kvk_organisation_id`     | Identifier for a KvK (Dutch Chamber of Commerce) registered       |

        |                           | organisation.                                                     |

        | `kvk_establishment_id`    | Identifier for a specific establishment of a KvK                  |

        |                           | (Dutch Chamber of Commerce) registered organisation.              |

        | `leerbedrijf_id`          | Dutch registration/accreditation id for organisations offering    |

        |                           | internships for vocational education students.                    |

        | `national_identity_number`| Government-assigned personal identifier (e.g. NI number in the UK,|

        |                           | or *personnummer* in Sweden).                                     |

        | `offering_code`           | Identifier for a specific offering (programme, course or          |

        |                           | component).                                                       |

        | `organisation_id`         | Identifier for an organisation.                                   |

        | `orcid`                   | Open Researcher and Contributor ID.                               |

        | `product_id`              | Identifier for a product.                                         |

        | `programme_code`          | Identifier of a programme (a recognised collection of courses).   |

        |                           | In the Netherlands, the former CREBO and CROHO codes have been    |

        |                           | replaced by the programme code as registered in RIO, under the    |

        |                           | authority of OCW.                                                 |

        | `room_code`               | Identifier for a room.                                            |

        | `schac_home`              | Home organisation represented by its domain name.                 |

        | `student_number`          | Identifier for a student.                                         |

        | `studielink_number`       | Identifier assigned to a student by Studielink (Dutch central     |

        |                           | enrolment system).                                                |

        | `system_id`               | Identifier used within a specific system.                         |

        | `username`                | User login name.                                                  |

        | `uuid`                    | Universally unique identifier.                                    |


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - account_id
      - bag_id
      - building_id
      - component_code
      - eckid
      - email_address
      - esi
      - group_code
      - group_type_code
      - identifier
      - institution_code
      - isbn
      - issn
      - kvk_organisation_id
      - kvk_establishment_id
      - leerbedrijf_id
      - offering_code
      - organisation_id
      - orcid
      - product_id
      - programme_code
      - room_code
      - schac_home
      - student_number
      - studielink_number
      - system_id
      - username
      - uuid
      - national_identity_number
      example: identifier
    IdentifierEntry:
      type: object
      properties:
        codeType:
          $ref: '#/components/schemas/codeType'
        code:
          description: Human readable value for the code/identifier
          type: string
          example: 1234qwe12
      required:
      - codeType
      - code
      additionalProperties: false
      example:
        codeType: identifier
        code: 1234qwe12
    LanguageTypedString:
      type: object
      description: A String with an associated language code. IF this object is used both fields are mandatory.
      required:
      - language
      - value
      properties:
        language:
          $ref: '#/components/schemas/Language'
        value:
          description: String to describe the entity.
          type: string
          example: programme that is a place holder for all courses that are made available for student mobility
      example:
        language: en-GB
        value: programme that is a place holder for all courses that are made available for student mobility
    Identifier:
      type: string
      description: An identifier of another resource.
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    filterPresence:
      type: string
      description: "Presence check or special value for filter operations.\n\nInspired by Storyblok (https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries)\n\nImplementation note:\n- The availability and behaviour of this query functionality are entirely determined by the organisation hosting\n  the API implementation. It is not mandatory for implementers to support this functionality, and it cannot be enforced \n  upon organisations that provide or consume OEAPI endpoints.\n- It is up to each implementer to decide whether to support this feature. It is **not** a requirement of the OEAPI \n  standard itself.\n- Consumers or working groups that wish to apply specific filtering mechanisms are encouraged to do so using \n  this approach for the sake of consistency across implementations.\n"
      enum:
      - empty
      - not_empty
      - empty_array
      - not_empty_array
      - 'true'
      - 'false'
      - 'null'
      - not_null
      example: not_empty
    Problem:
      type: object
      description: 'A problem details object, conforming to RFC 7807 (Problem Details for HTTP

        APIs). See https://datatracker.ietf.org/doc/html/rfc7807. It provides a

        machine-readable format for error conditions, including a type URI, title,

        status code, and optional detail and instance fields. This ensures

        consistent handling of error responses across the API.

        '
      required:
      - type
      - status
      - title
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
          description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
          example: https://example.org/problems/bad-request
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Resource not found
        status:
          type: integer
          format: int32
          description: "The HTTP status code generated by the origin server for this occurrence \nof the problem.\n"
          example: 404
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem

            '
          example: The course with id 'abc123' could not be found in the catalogue.
        instance:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          description: 'An absolute URI that identifies the specific occurrence of the problem.

            '
          example: https://api.example.org/courses/abc123
    title:
      type: string
      description: A short, human-readable summary of the problem type
      example: Resource not found
  parameters:
    search:
      name: q
      in: query
      description: Filter by items having a name, abbreviation or description containing the given search term (exact partial match, case insensitive)
      required: false
      schema:
        type: string
    consumer:
      name: consumer
      in: query
      description: Request entities intended for a specific consumer. The `consumer` profile allows for adding additional data, or specific rules concerning the presentation of the data. A consumer can be selected based on the key of the consumer profile. An implementation of the OEAPI SHOULD always return the consumer information inside the consumer property of the object(s) that are requested. Further information regarding the use of consumers can be found in the [documentation](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/)
      required: false
      schema:
        type: string
    filterQuery:
      name: filter_query
      in: query
      required: false
      x-lint-ignore:
      - camel-case-properties
      style: deepObject
      explode: true
      description: "Filter object serialised as `filter_query[field][operation]=value`.\nMultiple top-level fields are combined with AND. CSV is accepted where noted.\n\nOR blocks. Provide an array of single-field filter objects, each combined with OR.\nSerialises as `filter_query[__or][][field][operation]=value`.\n\nInspired by Storyblok (https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries)\n\nWildcards:\n- Prefer using only the asterisk `*` as a wildcard for partial matches (e.g., like and not_like).\n\nImplementation note:\n- The availability and behaviour of this query functionality are entirely determined by the organisation hosting\n  the API implementation. It is not mandatory for implementers to support this functionality, and it cannot be enforced \n  upon organisations that provide or consume OEAPI endpoints.\n- It is up to each implementer to decide whether to support this feature. It is **not** a requirement of the OEAPI \n  standard itself.\n- Consumers or working groups that wish to apply specific filtering mechanisms are encouraged to do so using \n  this approach for the sake of consistency across implementations.\n\nExamples:  \n- **Filter course offerings by programme, delivery, language and start date**  \n  `filter_query[programme.code][in]=B-IT-2025&filter_query[organisation.code][in]=RuG&filter_query[mode_of_delivery][in]=on_campus,hybrid&filter_query[language_of_instruction][in]=en-GB&filter_query[start_date][gt_date]=2025-09-01T00:00:00Z`  \n  \n- **Only offerings with email contact present**  \n  `filter_query[contacts.email][is]=not_empty`\n\n- **Provider is Org A or Org B, OR campus city contains “Utrecht”**  \n  `?filter_query[__or][][organisation.id][in]=org-uu,org-hku&filter_query[__or][][campus.city][like]=*Utrecht*`  \n    \n- **Start date after 1 Sept 2025 OR has evening/block_week tag**  \n  `?filter_query[__or][][start_date][gt_date]=2025-09-01T00:00:00Z&filter_query[__or][][tags][any_in_array]=evening,block_week`  \n"
      schema:
        type: object
        properties:
          __or:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
                properties:
                  in:
                    type: string
                    description: Exact match; multiple values allowed as CSV.
                    example: org-uu,org-hku
                  like:
                    type: string
                    description: 'Partial match using wildcards. Prefer `*` as the wildcard.

                      # Quotes are required here because YAML interprets unquoted * as an alias reference.

                      '
                    example: '*Utrecht*'
                  any_in_array:
                    type: string
                    description: Match if any of the CSV values occur.
                    example: evening,block_week
                  gt_date:
                    type: string
                    format: date-time
                    description: ISO 8601 / RFC 3339 date-time.
                    example: '2025-09-01T00:00:00Z'
                  lt_date:
                    type: string
                    format: date-time
                    description: ISO 8601 / RFC 3339 date-time.
                    example: '2025-12-31T23:59:59Z'
        additionalProperties:
          type: object
          properties:
            is:
              $ref: '#/components/schemas/filterPresence'
            in:
              type: string
              description: Exact match; multiple values allowed as CSV.
              example: RuG
            not_in:
              type: string
              description: Negated inclusion; multiple values as CSV.
              example: UvA,VU
            like:
              type: string
              description: 'Partial match using wildcards. Prefer `*` as the wildcard.

                '
              example: '*Amsterdam*'
            not_like:
              type: string
              description: 'Negated partial match using wildcards. Prefer `*` as the wildcard.

                '
              example: '*deprecated*'
            any_in_array:
              type: string
              description: Match if any of the CSV values occur.
              example: evening,block_week
            all_in_array:
              type: string
              description: Match if all CSV values occur.
              example: evening,block_week
            gt_int:
              type: integer
              description: Greater than (integer).
              example: 5
            lt_int:
              type: integer
              description: Less than (integer).
              example: 30
            gt_float:
              type: number
              description: Greater than (float).
              example: 5.5
            lt_float:
              type: number
              description: Less than (float).
              example: 12
            gt_date:
              type: string
              format: date-time
              description: ISO 8601 date-time.
              example: '2025-09-01T00:00:00Z'
            lt_date:
              type: string
              format: date-time
              description: ISO 8601 date-time.
              example: '2025-12-31T23:59:59Z'
    fields:
      name: fields
      in: query
      required: false
      style: form
      explode: false
      description: "Allows clients to indicate which fields should be included in the response.  \nThis parameter supports the principle of data minimisation and helps to optimise \ndata usage and performance by reducing unnecessary data transmission.\n\nThe `fields` parameter uses *nested field selection syntax* with parentheses for subfields, \nfor example: `programme(code)` or `campus(city)`.  \nMultiple fields can be grouped within parentheses, for example:  \n`fields=(id,title,ectsCredits,programme(code),campus(city))`.\n\nWhen omitted, the server returns all fields the client has access to.  \nUnknown field names SHOULD be ignored.  \nThe server MUST always include *mandatory fields* (e.g., identifiers such as `id`) \nthat are required for a valid or minimal response, even if not explicitly requested.\n\n*Important:* This is a **request hint**, not a **security feature**.  \nThe server MAY disregard the request for a restricted set of fields, and the final response \nstructure MAY depend on server logic and the client’s access rights.\n\n\nIf a client requests unauthorised fields, these MUST be silently omitted or redacted.\n"
      schema:
        type: string
        example: (id,title,ectsCredits,programme(code),campus(city))
      examples:
        minimal:
          summary: Return a minimal fieldset for course offerings
          value: (id,title,ectsCredits,languageOfInstruction)
        nested:
          summary: Include nested programme code and campus city
          value: (id,title,programme(code),campus(city))
        combined:
          summary: Example using multiple nested fields
          value: (id,title,ectsCredits,programme(code,name),campus(city,country))
    pageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        enum:
        - 10
        - 20
        - 50
        - 100
        - 250
    pageNumber:
      name: pageNumber
      in: query
      description: The page number to get. Page numbers start at 1.
      required: false
      schema:
        type: integer
        format: int32
        example: 1
        minimum: 1
    primaryCode:
      name: primaryCode
      in: query
      description: The primaryCode of the requested item. This is often the source identifier as defined by the institution.
      required: false
      schema:
        type: string
  responses:
    ErrorForbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/forbidden
            title: Forbidden
            status: 403
            detail: You do not have permission to access this resource.
            instance: https://api.example.org/admin/enrolments
    ErrorInternalServerError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/internal-server-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred while processing your request.
            instance: https://api.example.org/enrolments/submit
    ErrorUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication credentials were missing or invalid.
            instance: https://api.example.org/student/12345
    ErrorTooManyRequests:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/too-many-requests
            title: Too many requests
            status: 429
            detail: You have exceeded the rate limit of 100 requests per minute.
            instance: https://api.example.org/courses
    ErrorNotAcceptable:
      description: 'Not Acceptable.


        Returned when the server cannot produce a representation in the

        requested OEAPI or consumer version. The server may serve the

        requested version or any lower compatible minor version.


        If neither the requested version nor a lower minor version is

        available, a 406 response is returned to indicate that no acceptable

        representation can be produced.


        This behaviour slightly deviates from strict HTTP semantics. The client

        requests exactly one OEAPI version and at most one consumer with one

        consumer version using the HTTP Accept header. Standard HTTP content

        negotiation is not applied. The server performs an internal Accept-like

        version check after the HTTP layer.


        If the request can be satisfied, the server returns a compatible

        version. A compatible version is any version within the same major

        version, with a higher or lower minor version.


        If no compatible version can be provided, the server returns 406 to

        signal that the requested representation cannot be provided.


        This approach improves clarity, implementation consistency and

        debugging, because the requested and supported versions are explicit

        in both the request and the 406 response, avoiding ambiguity caused

        by full HTTP content negotiation or Accept-based parsing.


        It also improves logging. Servers can log the requested and supported

        versions at the point of mismatch, allowing operators to detect

        outdated consumers, configuration issues or unexpected version drift.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemVersionNotAcceptable'
          examples:
            unsupportedOoapiVersion:
              summary: Requested OEAPI version is not supported
              description: 'Example where the client requests OEAPI version 5.0 and the server

                cannot serve that version or a lower compatible minor version.

                '
              value:
                type: https://api.example.org/problems/version-not-acceptable
                title: Version not acceptable
                status: 406
                detail: The requested OEAPI version '5.0' cannot be served.
                requestedVersion: '5.0'
                supportedVersions:
                - '6.1'
                - '6.0'
                instance: https://api.example.org/courses
            unsupportedConsumerVersion:
              summary: Requested consumer version is not supported
              description: 'Example where the client requests consumer version 2.0 which is not

                supported by the server and no lower compatible consumer version is

                available.

                '
              value:
                type: https://api.example.org/problems/version-not-acceptable
                title: Version not acceptable
                status: 406
                detail: The consumer version '2.0' is not supported.
                consumer:
                  consumerKey: mbo-oke-roster-service
                requestedVersion: '2.0'
                supportedVersions:
                - '1.0'
                - '0.94'
                instance: https://api.example.org/enrolments
    ErrorNotFound:
      description: "Not Found.  \n\nReturned only when a specific resource identified by its identifier\ncannot be located. This applies to instance endpoints where a single,\nuniquely-addressable object is expected.  \n\nCollection endpoints should not return a 404. If no items match the request,\nthey must return an empty array. A 404 may still occur if the collection\nendpoint itself does not exist or is not accessible.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            instanceNotFound:
              summary: 'Instance endpoint: resource not found'
              value:
                type: https://api.example.org/problems/not-found
                title: Resource not found
                status: 404
                detail: The course with id 'abc123' could not be found.
                instance: https://api.example.org/courses/abc123
            collectionEndpointNotFound:
              summary: Collection endpoint unavailable
              value:
                type: https://api.example.org/problems/not-found
                title: Collection endpoint not found
                status: 404
                detail: The collection endpoint '/course-offerings' does not exist or is not accessible.
                instance: https://api.example.org/course-offerings
    ErrorMethodNotAllowed:
      description: Method not allowed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/method-not-allowed
            title: Method not allowed
            status: 405
            detail: The method POST is not supported for this endpoint.
            instance: https://api.example.org/courses/abc123
    ErrorConflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/conflict
            title: Conflict
            status: 409
            detail: The request could not be completed due to a conflict with the current state of the resource.
            instance: https://api.example.org/courses
    ErrorBadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.org/problems/invalid-parameter
            title: Invalid request parameters
            status: 400
            detail: 'The query parameter ''mode'' must be one of: full, basic.'
            instance: https://api.example.org/courses?mode=invalid
