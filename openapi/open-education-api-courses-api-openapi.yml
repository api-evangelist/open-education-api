      description: An object describing the metadata of a course
      required:
      - name
      - primaryCode
      properties:
        primaryCode:
          description: The primary human readable identifier for this course. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
        name:
          type: array
          description: The name of this course (ECTS-title)
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: Academic and Professional Writing
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation or internal code used to identify this course (ECTS-code)
          maxLength: 256
          example: INFOMQNM
        studyLoad:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StudyLoadDescriptor'
        modesOfDelivery:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/modeOfDelivery'
        duration:
          type:
          - string
          - 'null'
          description: The duration of this course. The duration format is from the ISO 8601 ABNF as given in Appendix A of RFC 3339.
          pattern: ^-?P(?:\d+Y)?(?:\d+M)?(?:\d+(?:D|W))?(?:T(?:\d+H)?(?:\d+M)?(?:\d+(?:\.\d+)?S)?)?$
          example: P1DT10H30M
        firstStartDate:
          type:
          - string
          - 'null'
          description: The date and time when participants can follow this course for the first time.
          format: date-time
          example: '2020-09-28T08:30:00+01:00'
        description:
          type:
          - array
          - 'null'
          description: The description of this course (ECTS-description).
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: As with all empirical sciences, to assure valid outcomes, HCI studies heavily rely on research methods and statistics. This holds for the design of user interfaces, personalized recommender systems, and interaction paradigms for the internet of things. This course prepares you to do so by learning you to collect data, design experiments, and analyse the results. By the end of the course, you will have a detailed understanding of how to select and apply quantitative research methods and analysis to address virtually all HCI challenges. Quantitative research and data analysis will be taught in the context of state-of-the-art HCI challenges. Lectures will be alternated with hands-on learning, including work with predefined datasets (e.g., addressing facial features, cognitive load, and emotion). Additionally, students will set up their own research (e.g., using eye tracking). Data processing and analysis will be executed using R.
        teachingLanguages:
          type:
          - array
          - 'null'
          description: The languages in which this course is given, should be three-letter language codes as specified by RFC 4647. A student should be reasonably proficient in each language to be able to follow the course.
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
        fieldsOfStudy:
          type:
          - string
          - 'null'
          description: "Field(s) of study (e.g. ISCED-F) (https://unesdoc.unesco.org/ark:/48223/pf0000228085.locale=en). \nISCED-F categorizes the fields of study 2 digits at root level and further subdivision as more digits are added.\nPreferably fieldsOfStudy contains at least 4 digits.\nISCEDF2013vSOI2021 currently allows for 6 digits max (https://www.cbs.nl/-/media/cbs/onze-diensten/methoden/classificaties/documents/2025/pubsoi2021_ed2425.pdf).\n07 Engineering, manufacturing and construction\n073 Architecture and construction\n0731 Architecture and town planning\n073101 Town planning\n"
          minLength: 2
          maxLength: 6
          example: '0732'
        learningOutcomeIds:
          description: 'The identifiers of the learning outcomes related to this course.

            When the client does not request expansion of `learningOutcomes`, only these

            identifiers are returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        learningOutcomes:
          description: 'The expanded learning outcome objects related to this course.

            When the client requests expansion of `learningOutcomes`, the full expanded

            learning outcome objects MUST be returned here instead of only the identifiers.

            If no learning outcomes are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LearningOutcome'
        admissionRequirements:
          type:
          - array
          - 'null'
          description: This information may be given at an institutional level and/or at the level of individual programmes. Make sure that it is clear whether the information applies to fee-paying students (national and/or international) or to exchange students.
          example:
          - language: en-GB
            value: Students need to be enrolled at qualifying institutions of higher education that participate in this alliance
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
        qualificationRequirements:
          type:
          - array
          - 'null'
          description: Normally, students will receive a diploma when they have completed the (official) study programme and have obtained the required number of credits. If there are any other specific requirements that students need to have fulfilled, mention them here.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
        level:
          oneOf:
          - $ref: '#/components/schemas/level'
          - type: 'null'
        enrolment:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          description: The extra information that is provided for enrolment
          example:
          - language: en-GB
            value: enrolment through SIS. [The limited implementation of Git Hub Markdown syntax](https://oeapi.eu/v6.0/#/technical/formatting-text) MAY be used for rich text representation.
        resources:
          type:
          - array
          - 'null'
          description: An overview of the literature and other resources that is used in this course (ECTS-recommended reading and other sources)
          items:
            type: string
          example:
          - book to be announced
          - on-line resource x
        assessment:
          type:
          - array
          - 'null'
          description: A description of the way exams for this course are taken (ECTS-assessment method and criteria).
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: Exam on campus
        link:
          type:
          - string
          - 'null'
          description: URL of the course's website
          format: uri
          maxLength: 2048
          example: https://osiris.uu.nl/osiris_student_uuprd/OnderwijsCatalogusZoekCursus.do#submitForm?cursuscode=INFOMQNM
        addresses:
          type:
          - array
          - 'null'
          description: Addresses for this course
          items:
            $ref: '#/components/schemas/Address'
        otherCodes:
          type:
          - array
          - 'null'
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
        programmeIds:
          description: 'The identifiers of the programmes of which this course is a part.

            This array is used because a course can belong to multiple programmes,

            for example in alliances.

            When the client does not request expansion of `programmes`, only these

            identifiers are returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        supplementaryInformation:
          $ref: '#/components/schemas/SupplementaryInformation'
        programmes:
          description: 'The expanded programme objects of which this course is a part.

            This array is used because a course can belong to multiple programmes,

            for example in alliances.

            When the client requests expansion of `programmes`, the full expanded

            programme objects MUST be returned here instead of only the identifiers.

            If no programmes are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Programme'
        coordinatorIds:
          description: 'The identifiers of the persons responsible for this course.

            When the client does not request expansion of `coordinators`, only these

            identifiers are returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        coordinators:
          description: 'The expanded person objects responsible for this course.

            When the client requests expansion of `coordinators`, the full expanded

            person objects MUST be returned here instead of only the identifiers.

            If no coordinators are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Person'
        instructorIds:
          description: 'The identifiers of the persons teaching or delivering this course.

            When the client does not request expansion of `instructors`, only these

            identifiers are returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        instructors:
          description: 'The expanded person objects teaching or delivering this course.

            When the client requests expansion of `instructors`, the full expanded

            person objects MUST be returned here instead of only the identifiers.

            If no instructors are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Person'
        organisationId:
          description: 'The identifier of the organisation that manages this course.

            When the client does not request expansion of `organisation`, only this

            identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        organisation:
          description: 'The expanded organisation object that manages this course.

            When the client requests expansion of `organisation`, the full expanded

            organisation object MUST be returned here instead of only the identifier.

            If no organisation is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        consumer:
          oneOf:
          - $ref: '#/components/schemas/Consumer'
          - type: 'null'
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    filterPresence:
      type: string
      description: "Presence check or special value for filter operations.\n\nInspired by Storyblok (https://www.storyblok.com/docs/api/content-delivery/v2/filter-queries)\n\nImplementation note:\n- The availability and behaviour of this query functionality are entirely determined by the organisation hosting\n  the API implementation. It is not mandatory for implementers to support this functionality, and it cannot be enforced \n  upon organisations that provide or consume OEAPI endpoints.\n- It is up to each implementer to decide whether to support this feature. It is **not** a requirement of the OEAPI \n  standard itself.\n- Consumers or working groups that wish to apply specific filtering mechanisms are encouraged to do so using \n  this approach for the sake of consistency across implementations.\n"
      enum:
      - empty
      - not_empty
      - empty_array
      - not_empty_array
      - 'true'
      - 'false'
      - 'null'
      - not_null
      example: not_empty
    Problem:
      type: object
      description: 'A problem details object, conforming to RFC 7807 (Problem Details for HTTP

        APIs). See https://datatracker.ietf.org/doc/html/rfc7807. It provides a

        machine-readable format for error conditions, including a type URI, title,

        status code, and optional detail and instance fields. This ensures

        consistent handling of error responses across the API.

        '
      required:
      - type
      - status
      - title
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
          description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
          example: https://example.org/problems/bad-request
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Resource not found
        status:
          type: integer
          format: int32
          description: "The HTTP status code generated by the origin server for this occurrence \nof the problem.\n"
          example: 404
        detail:
          type:
          - string
          - 'null'
          description: 'A human-readable explanation specific to this occurrence of the problem

            '
          example: The course with id 'abc123' could not be found in the catalogue.
        instance:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          description: 'An absolute URI that identifies the specific occurrence of the problem.

            '
          example: https://api.example.org/courses/abc123
    supplementaryRole:
      type: string
      description: 'The fundamental semantic purpose of the supplementary content. The selected

        `role` describes the intent or function of the item (for example, badge,

        teaser or promotional highlight).


        The `role` MUST NOT duplicate or encode the technical media form defined by

        `type`. The `type` specifies the underlying media form (such as text, image,

        video or http), whereas the `role` clarifies how that media is intended to be

        interpreted or used.


        | Code           | Description                                         |

        |----------------|-----------------------------------------------------|

        | `announcement` | General-purpose announcement or notice              |

        | `badge`        | A visual label or achievement marker                |

        | `marketing`    | Promotional or marketing-related content            |

        | `promo`        | A short promotional highlight or teaser             |


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - announcement
      - badge
      - marketing
      - promo
      example: badge
    title:
      type: string
      description: A short, human-readable summary of the problem type
      example: Resource not found
    formalDocument:
      type: string
      description: 'The type of formal document obtained upon completion of an educational programme:


        | Code                        | Description                                    |

        |-----------------------------|------------------------------------------------|

        | `certificate`               | A formal recognition of participation or       |

        |                             | achievement                                    |

        | `diploma`                   | An official qualification awarded upon         |

        |                             | graduation                                     |

        | `micro_credential_certificate` | Formal certification specifically           |

        |                             | documenting the award of a micro-credential    |

        | `school_advice`             | Educational recommendation or guidance issued  |

        |                             | by the school                                  |

        | `testimonial`               | A written statement confirming attendance or   |

        |                             | performance                                    |

        | `no_official_document`      | No official document is issued                 |


        This is an *extensible enumeration*. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - certificate
      - diploma
      - micro_credential_certificate
      - school_advice
      - testimonial
      - no_official_document
      example: diploma
    programmeType:
      type: string
      description: 'The type of this programme:


        - programme: A full formal programme of study leading to a qualification or degree

        - minor: A smaller, complementary programme that broadens or deepens the main field of study

        - honours: An honours programme, typically with additional academic requirements or distinction

        - specialisation: A focused area of study within a broader programme or degree

        - track: A structured learning path within a programme, often thematically or methodologically defined

        - specification: A further defined variant or subset of a track or specialisation


        This is an extensible enumeration. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - programme
      - minor
      - honours
      - specialisation
      - track
      - specification
      example: programme
    educationSpecificationType:
      type: string
      description: "The type of education specification\n  - program: HOOPLEIDING\n  - privateProgram: PARTICULIEREOPLEIDING\n  - programCluster: HOONDERWIJSEENHEDENCLUSTER\n  - course: HOONDERWIJSEENHEID\n"
      enum:
      - program
      - privateProgram
      - cluster
      - course
      example: program
    Consumer_2:
      type: object
      description: Object for communicating data to a specific consumer (destination). This object has no relationship with the `consumer` query parameter.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information.
          type: string
      additionalProperties: true
    Offering:
      allOf:
      - $ref: '#/components/schemas/OfferingId'
      - $ref: '#/components/schemas/OfferingProperties'
    ProgramOffering:
      allOf:
      - $ref: '#/components/schemas/Offering'
      - type: object
        required:
        - startDate
        - endDate
        properties:
          startDate:
            type: string
            description: The moment on which this offering starts, RFC3339 (full-date)
            format: date
            example: '2019-08-21'
          endDate:
            type: string
            description: The moment on which this offering ends, RFC3339 (full-date)
            format: date
            example: '2023-06-15'
          enrollStartDate:
            type: string
            description: The first day on which a student can enroll for this program.
            format: date
            example: '2019-05-01'
          enrollEndDate:
            type: string
            description: The last day on which a student can enroll for this program.
            format: date
            example: '2019-08-01'
          flexibleEntryPeriodStart:
            type: string
            description: If this is a program wherein participants can start at various moments, without missing anything, use this attribute in combination with `flexibleEntryPeriodEnd`.
            format: date
          flexibleEntryPeriodEnd:
            type: string
            description: If this is a program wherein participants can start at various moments, without missing anything, use this attribute in combination with `flexibleEntryPeriodStart`.
            format: date
          addresses:
            type: array
            description: Addresses for this offering
            items:
              $ref: '#/components/schemas/Address_2'
          priceInformation:
            type: array
            description: Price information for this offering.
            items:
              $ref: '#/components/schemas/Cost'
            minItems: 1
          program:
            description: 'The Program that is offered in this programoffering. [`expandable`](#tag/program_model)

              By default only the `programId` (a string) is returned. If the client requested an expansion of `program` the full program object should be returned.

              '
            oneOf:
            - $ref: '#/components/schemas/Identifier_2'
              title: programId
            - $ref: '#/components/schemas/Program'
              title: Program object
          organization:
            description: 'The organization that manages this programeoffering. [`expandable`](#tag/organization_model)

              By default only the `organizationId` (a string) is returned. If the client requested an expansion of `organization` the full organization object should be returned.

              '
            oneOf:
            - $ref: '#/components/schemas/Identifier_2'
              title: organizationId
            - $ref: '#/components/schemas/Organization'
              title: Organization object
    TimelineOverrideCourse_2:
      type: object
      required:
      - validFrom
      - course
      description: A timeline override of the course.
      properties:
        validFrom:
          type: string
          description: The day on which this timelineOverride starts (inclusive), RFC3339 (date)
          format: date
          example: '2021-09-01'
        validTo:
          type: string
          description: The day on which this timelineOverride ends (exclusive), RFC3339 (date)
          format: date
          example: '2022-08-31'
        course:
          $ref: '#/components/schemas/CourseProperties_2'
    qualificationAwarded_2:
      type: string
      description: Type of qualificaton that can be obtained on finishing the program
      enum:
      - AD
      - BA
      - BSc
      - LLB
      - MA
      - MSc
      - LLM
      - Phd
      - None
      example: None
    Address_2:
      type: object
      description: The full street address
      required:
      - addressType
      properties:
        addressType:
          $ref: '#/components/schemas/addressType_2'
        street:
          type: string
          description: The street name
          example: Moreelsepark
        streetNumber:
          type: string
          description: The street number
          example: '48'
        additional:
          type: array
          description: Further details like building name, suite, apartment number, etc.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString_2'
          example:
          - language: en-GB
            value: On the other side of the road
        postalCode:
          type: string
          description: Postal code
          example: 3511 EP
        city:
          type: string
          description: name of the city / locality
          example: Utrecht
        countryCode:
          type: string
          description: the country code according to [iso-3166-1-alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
          example: NL
        geolocation:
          type: object
          description: Geolocation of the entrance of this address (WGS84 coordinate reference system)
          required:
          - latitude
          - longitude
          properties:
            latitude:
              type: number
              format: double
              example: 52.089123
            longitude:
              type: number
              format: double
              example: 5.113337
        ext:
          $ref: '#/components/schemas/Ext'
    OfferingProperties:
      type: object
      description: Either a program, course or component offering which descrbes the program, course or offering in time
      required:
      - primaryCode
      - offeringType
      - name
      - description
      - teachingLanguage
      - resultExpected
      properties:
        primaryCode:
          description: The primary human readable identifier for this offering. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry_2'
          example:
            codeType: offeringCode
            code: INFOMQNM-20FS
          readOnly: true
        offeringType:
          type: string
          description: The type of this offering
          enum:
          - program
          - course
          - component
          example: component
        academicSession:
          description: 'The academicsession during which this courseoffering takes place. [`expandable`](#tag/academic_session_model)

            By default only the `academicSessionId` (a string) is returned. If the client requested an expansion of `academicSession` the full academicsession object should be returned.

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier_2'
            title: academicSessionId
          - $ref: '#/components/schemas/AcademicSession'
            title: AcademicSession object
        name:
          type: array
          description: The name of this offering
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString_2'
          example:
          - language: en-GB
            value: Final written test for INFOMQNM for fall semseter 2020
        abbreviation:
          type: string
          description: The abbreviation or internal code used to identify this offering
          maxLength: 256
          example: Test-INFOMQNM-20FS
        description:
          type: array
          description: The description of this offering.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString_2'
          example:
          - language: en-GB
            value: '''Prove in writing knowledge of research methods, including:

              Acquire knowledge of HCI research paradigms

              Able to design suitable research studies (e.g., choose between within and between subject designs)

              Define/apply/design metrics and scales

              Define/produce materials (e.g., stimuli and questionnaires)

              Define protocols for research studies

              Understands and take in account concepts of reliability and validity

              Analyze and improve methods and analysis of published scientific articles

              Able to deliver scientific reports

              Prove in writing knowledge of ­­­statistics, including:

              Handle hypothesis testing with complex designs (e.g., including , dependent, independent, and co variates)

              Data preparation (e.g., coding and feature selection)

              Reason towards adequate techniques to ensure valid outcomes (e.g., be aware of type I, type II errors)

              Select an appropriate sampling method (e.g., stratified)

              Perform parametric tests (e.g., repeated measures (M)ANOVA)

              Perform non-parametric tests (e.g., Chi-square, Mann-Whitney, and Kruskal-Wallis)''

              '
        teachingLanguage:
          type: string
          description: The (primary) teaching language in which this offering is given, should be a three-letter language code as specified by ISO 639-2.
          minLength: 3
          maxLength: 3
          pattern: ^[a-z]{3}$
          example: nld
        modeOfDelivery:
          $ref: '#/components/schemas/modesOfDelivery'
        maxNumberStudents:
          type: number
          description: The maximum number of students allowed to enroll for this offering
          format: int32
          minimum: 0
          example: 200
        enrolledNumberStudents:
          type: number
          description: The number of students that have already enrolled for this offering
          format: int32
          minimum: 0
          example: 150
        pendingNumberStudents:
          type: number
          description: The number of students that have a pending enrollment request for this offering
          format: int32
          minimum: 0
          example: 50
        minNumberStudents:
          type: number
          description: The minimum number of students needed for this offering to proceed
          format: int32
          minimum: 0
          example: 15
        resultExpected:
          type: boolean
          description: "resultExpected, previously knwon as isLineItem is used so the specific instance of the object is identified as being an element that CAN contain “grade” information.\nOfferings do not always have to result in a grade or an other type of result. \nIf there is a result expected from a programOffering/courseOffering/componentOffering the is resultExpected field should parse true\n"
          example: true
        resultValueType:
          $ref: '#/components/schemas/resultValueType'
        link:
          type: string
          description: URL of this offering's webpage.
          format: uri
          maxLength: 2048
          example: https://osiris.uu.nl/osiris_student_uuprd/OnderwijsCatalogusZoekCursus.do#submitForm?cursuscode=INFOMQNM
        otherCodes:
          type: array
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry_2'
        consumers:
          description: The additional consumer elements that can be provided, see the [documentation on support for specific consumers](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information about this mechanism.
          type: array
          items:
            $ref: '#/components/schemas/Consumer_2'
          example:
          - consumerKey: rio
            explanationRequiredPermission: Toestemming is vereist omdat we daarom vragen.
            requiredPermissionRegistration: 'yes'
            registrationStatus: open
            modeOfDelivery:
            - coaching
        ext:
          $ref: '#/components/schemas/Ext'
    CourseExpanded_2:
      allOf:
      - $ref: '#/components/schemas/Course_2'
      - type: object
        description: These properties are only present when explicitly included
        properties:
          timelineOverrides:
