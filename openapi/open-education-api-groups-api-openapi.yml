          type:
          - integer
          - 'null'
          format: int32
          description: Total number of pages
          example: 8
    Identifier:
      type: string
      description: An identifier of another resource.
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    Organisation:
      type: object
      description: A description of a group of people working together to achieve a goal
      required:
      - organisationId
      - organisationType
      - name
      - primaryCode
      properties:
        organisationId:
          type: string
          description: Unique id of this organisation
          format: uuid
          example: 123e4567-e89b-12d3-a456-123514174000
        primaryCode:
          description: The primary human readable identifier for the organisation. This is often the source identifier as defined by the root organisation.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: organisation_id
            code: Org01-Root
        organisationType:
          $ref: '#/components/schemas/organisationType'
        name:
          type: array
          description: The name of the organisation
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: nl-NL
            value: Coöperatie SURF U.A.
        shortName:
          type:
          - string
          - 'null'
          description: Short name of the organisation
          maxLength: 256
          example: SURF
        description:
          type:
          - array
          - 'null'
          description: "If the organisation is an educational organisation, any general description should clearly mention the type of \neducation organisation, especially in the case of a binary system. In Dutch; universiteit (university) or \nhogeschool (university of applied sciences).\nIf the organisation is not an educational organisation, a general description should describe the role it plays \nin education like providing certain types of internships, educational services, products or facilities.\n"
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: nl-NL
            value: SURF is een coöperatieve vereniging van Nederlandse onderwijs- en onderzoeksinstellingen waarin de leden hun krachten bundelen. De leden zijn eigenaar van SURF.
        addresses:
          type:
          - array
          - 'null'
          description: Addresses of this organisation
          items:
            $ref: '#/components/schemas/Address'
        link:
          type:
          - string
          - 'null'
          description: URL of the organisation's website
          format: uri
          maxLength: 2048
          example: https://surf.nl
        logo:
          type:
          - string
          - 'null'
          description: Logo of this organisation
          format: uri
          maxLength: 2048
          example: https://www.surf.nl/themes/surf/logo.svg
        otherCodes:
          type:
          - array
          - 'null'
          description: An array of additional human readable codes/identifiers for the entity being described.
          items:
            $ref: '#/components/schemas/IdentifierEntry'
          example:
          - codeType: institution_code
            code: 114B529
          - codeType: kvk_organisation_id
            code: '50277374'
        rootId:
          description: 'The identifier of the organisation which is the root organisation of this organisation.

            When the client does not request expansion of `root`, only this identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        root:
          description: 'The expanded organisation object which is the root organisation of this organisation.

            When the client requests expansion of `root`, the full expanded organisation object MUST be returned here instead of only the identifier.

            If no root organisation is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        parentId:
          description: 'The identifier of the organisational unit which is the parent of this organisation.

            When the client does not request expansion of `parent`, only this identifier is returned.

            This field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).

            '
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        parent:
          description: 'The expanded organisation object which is the parent of this organisation.

            When the client requests expansion of `parent`, the full expanded organisation object MUST be returned here instead of only the identifier.

            If no parent organisation is defined, this value is `null`.

            '
          oneOf:
          - $ref: '#/components/schemas/Organisation'
          - type: 'null'
        childIds:
          description: "The identifiers of the organisational units for which this organisation is the parent.\nWhen the client does not request expansion of `children`, only these identifiers are returned.\nThis field is [`expandable`](https://oeapi.eu/v6.0/#/technical/expanding-responses).\n\nAlthough `childIds` and `children` (for example `organisationIds` versus `organisations`) may \nseem unusual, this naming is intentional and follows the singular–plural convention defined \nby the specification.\n"
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Identifier'
        children:
          description: 'The expanded organisational unit objects for which this organisation is the parent.

            When the client requests expansion of `children`, the full expanded organisation objects MUST be returned here instead of only the identifiers.

            If no children are defined, this value is `null`.

            '
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/Organisation'
            - type: 'null'
        consumer:
          oneOf:
          - $ref: '#/components/schemas/Consumer'
          - type: 'null'
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    organisationType:
      type: string
      description: 'The type of this organisation. When using non-root organisation types, make sure that there is always a parent organisation of type root available.


        - root: The top-level organisation, representing the organisation itself

        - institute: A subdivision of the root organisation, typically focused on a broad field of study

        - department: An organisational unit within an organisation or one of the subdivisions of an organisation, focused on a specific discipline

        - faculty: A major academic division within an institution, often overseeing multiple departments

        - branch: A geographically separate location or campus of an organisation

        - academy: A specialised academic unit, often focused on applied or artistic disciplines

        - school: An organisational unit typically used in primary, secondary, or specialised higher education contexts


        This is an extensible enumeration. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - root
      - institute
      - department
      - faculty
      - branch
      - academy
      - school
      example: root
    groupType_2:
      type: string
      description: 'The type of this group

        - learning group: A collection of participants carrying out common learning activities

        - class: A collection of participants carrying out jointly scheduled educational activities

        - team: A collection of members of a team, either students, employees or mixed.

        '
      enum:
      - learning group
      - class
      - team
      example: learning group
    Consumer_2:
      type: object
      description: Object for communicating data to a specific consumer (destination). This object has no relationship with the `consumer` query parameter.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://openonderwijsapi.nl/v5/#/technical/consumers-and-profiles/) for more information.
          type: string
      additionalProperties: true
    personAffiliations:
      type: array
      description: 'The affiliations of this person, the relations a person has with the organization providing this endpoint

        - student: student

        - employee: medewerker

        - guest: gast

        '
      items:
        type: string
        enum:
        - student
        - employee
        - guest
        example: student
    codeType_2:
      type: string
      description: "The code/identifier type. \n\nThis is an *extensible enumeration*. Use `x-` to prefix custom values\n\nThe predefined values are:\n  - `brin`: The registration number for a Dutch educational institution that is issued by the Dutch Ministry of Education, Culture and Science\n  - `crohoCreboCode`: programs with a CREBO and CROHO number are accredited by the Dutch Ministry of Education, Culture and Science (OCW)\n  - `programCode`: Identifier for the program (collection of courses)\n  - `componentCode`: The code for a component (part of a course)\n  - `offeringCode`: The code to identify a specific offering (program, course or component offering)\n  - `organizationId`: The identifier for the organization\n  - `buildingId`: The number or code to identify a building\n  - `bagId`: The identification of a building as it is known in the Dutch Building Administration (BAG)\n  - `roomCode`: The code for a room\n  - `systemId`: Identifier assigned to an entity in context of a specific system\n  - `productId`: Identifier assigned to a specific product\n  - `nationalIdentityNumber`: Identifier assigned by the governement of the person. e.g. a social security number in the USA\n  - `studentNumber`: Identifier for the student\n  - `studielinkNumber`: Identifier for the person as determined by Studielink\n  - `esi`: European Student Identifier\n  - `userName`: The name of a user\n  - `accountId`: Identifier assigned to a specific account\n  - `emailAdress`: An email address\n  - `groupCode`: The identifier for a group (of persons)\n  - `isbn`: International Standard Book Number that serve as product identifiers for Books\n  - `issn`: International Standard Book Number that serve as product identifiers for periodicals\n  - `orcId`: Open Researcher and Contributor ID\n  - `uuid`: A universally unique identifier\n  - `schacHome`: Home organization using the domain name of the organization\n  - `identifier`: Generic Identifier\n"
      x-ooapi-extensible-enum:
      - brin
      - crohoCreboCode
      - programCode
      - componentCode
      - offeringCode
      - organizationId
      - buildingId
      - bagId
      - roomCode
      - systemId
      - productId
      - nationalIdentityNumber
      - studentNumber
      - studielinkNumber
      - esi
      - userName
      - accountId
      - emailAdress
      - groupCode
      - isbn
      - issn
      - orcId
      - uuid
      - schacHome
      - identifier
      example: identifier
    Problem_2:
