- aid: open-education-api:open-education-api-course-offering-associations-api
  name: Open Education API course offering associations API
  description: "The course offering associations API provides information about the association\nbetween\
    \ a course offering and a person (e.g. students, lecturers, etc).\nAssociations can be posted between\
    \ institutions. This requires detailed information\non the course offering and the persons. To allow\
    \ for this information a\ncomplete person object and offering object can be part of the API. The structure\n\
    is explained in the following model:\n<table>\n  <tr>\n   <td></td>\n   <td colspan=3 align=center>offering</td>\n\
    \  </tr>\n  <tr>\n   <td rowspan=3>student</td>\n   <td></td>\n   <!-- <td>internal</td>\n   -->\n\
    \   <td>external</td>\n  </tr>\n  <tr>\n   <td>internal</td>\n   <td>POST <a\n     href=\"#tag/course-offering-associations/operation/createExternalCourseOfferingAssociationByopenId\"\
    >\n     /course-offering-associations/external/me</a>Retrieves student details from the well known\
    \ endpoint \n     that exposes person information at the home institution.\n     It passes offering\
    \ details (provided by\n     external institution) to the home institution so the home institution\
    \ can\n     create a placeholder for the offering and its results.\n   </td>\n  </tr>\n  <tr>\n  \
    \ <td>external</td>\n   <td>no support needed</td>\n  </tr>\n</table>\nDirect update of current information:\
    \ <a\n  href=\"#tag/course-offering-associations/operation/partialUpdateCourseOfferingAssociationById\"\
    >\n  PATCH /course-offering-associations/{courseOfferingAssociationId}</a>\nThis call is currently\
    \ limited to passing results and a remote state. For future\nuse other association resource information\
    \ could be passed. More information on\nthe support for student mobility can be found\n<a href=\"\
    https://swimlanes.io/d/s5mfpj7Si\">here</a>"
  humanURL: https://oeapi.eu/specification/v6.0/
