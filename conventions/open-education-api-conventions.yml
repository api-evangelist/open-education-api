generated: '2026-10-09'
method: searched
source: https://oeapi.eu/v6.0/technical/design-principles.md
docs:
- https://oeapi.eu/v6.0/#/technical/design-principles
- https://oeapi.eu/v6.0/#/technical/versioning
- https://oeapi.eu/v6.0/#/technical/expanding-responses
- https://oeapi.eu/v6.0/#/technical/filtering-responses
- https://oeapi.eu/v6.0/#/technical/sorting-language
