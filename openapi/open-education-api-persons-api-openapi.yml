          validTo:
            description: The day this course ceases to be valid (e.g. exclusive).
            type: string
            format: date
    ProgramOfferingAssociation:
      allOf:
      - $ref: '#/components/schemas/Association'
      - type: object
        properties:
          result:
            $ref: '#/components/schemas/ProgramResult'
    modesOfDelivery:
      type: array
      description: 'The mode of delivery of the component (ECTS-mode of delivery)

        - distance-learning: afstandsleren

        - on campus: op de campus

        - online: online

        - hybrid: hybride

        - situated: op locatie

        '
      items:
        type: string
        enum:
        - distance-learning
