openapi: 3.2.0
info:
  title: Open Education Persons API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged persons across 2 of this provider''s published API definitions: oeapi-6.0-rc.3.yaml, ooapi-v5.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo01.eduapi.nl/v6
  description: SURF demo implementation
- url: http://demo01.eduapi.nl/v5
  description: SURF demo implementation
tags:
- name: Persons
  description: The persons API provides information about persons related to an organisation.
paths:
  /persons:
    get:
      summary: GET /persons
      operationId: listPersons
      description: Get an ordered list of all persons.
      tags:
      - Persons
      parameters:
      - $ref: '#/components/parameters/primaryCode'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/filterQuery'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/personSearch'
      - name: affiliations
        in: query
        description: Filter by affiliations
        required: false
        schema:
          $ref: '#/components/schemas/personAffiliation'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Person'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    post:
      summary: POST /persons
      operationId: createPerson
      description: POST a single person.
      tags:
      - Persons
      requestBody:
        required: true
        content:
          application/vnd.oeapi+json:
            schema:
              $ref: '#/components/schemas/PersonProperties'
      responses:
        '201':
          description: Created
          content:
            application/vnd.oeapi+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PersonId'
                - $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /persons/me:
    get:
      summary: GET /persons/me
      operationId: listPersonByMyOauthId
      description: 'Returns the person object for the currently authenticated user.


        Security must be implemented at the level of the actual deployment rather than in the core

        specification. This means that the specification remains neutral, while concrete security

        measures can be applied in practice using established techniques such as OpenID with

        fine-grained scopes.'
      tags:
      - Persons
      parameters:
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /persons/{personId}:
    get:
      summary: GET /persons/{personId}
      operationId: listPersonById
      description: Get a single person.
      tags:
      - Persons
      parameters:
      - name: personId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/consumer'
      responses:
        '200':
          description: OK
          content:
            application/vnd.oeapi+json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    put:
      summary: PUT /persons/{personId}
      operationId: replacePersonById
      description: change the data of a single person.
      tags:
      - Persons
      parameters:
      - name: personId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/vnd.oeapi+json:
            schema:
              $ref: '#/components/schemas/Person'
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '406':
          $ref: '#/components/responses/ErrorNotAcceptable'
        '409':
          $ref: '#/components/responses/ErrorConflict'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
    servers:
    - url: https://demo01.eduapi.nl/v6
      description: SURF demo implementation
  /persons/{personId}/associations:
    get:
      summary: GET /persons/{personId}/associations
      description: Get a list of all associations for an individual person.
      tags:
      - Persons
      parameters:
      - name: personId
        in: path
        description: Person ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer_2'
      - name: associationType
        in: query
        description: Filter by association type
        required: false
        schema:
          type: string
          enum:
          - programOffering
          - courseOffering
          - componentOffering
      - name: role
        in: query
        description: Filter by role
        required: false
        schema:
          $ref: '#/components/schemas/associationRole'
      - name: state
        in: query
        description: Filter by state
        required: false
        schema:
          $ref: '#/components/schemas/associationState'
      - name: result-state
        in: query
        description: Filter by result state
        required: false
        schema:
          $ref: '#/components/schemas/resultState'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - associationId
            - -associationId
          default:
          - associationId
          example:
          - associationId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination_2'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        oneOf:
                        - allOf:
                          - $ref: '#/components/schemas/ProgramOfferingAssociation'
                          - type: object
                            required:
                            - offering
                            properties:
                              offering:
                                $ref: '#/components/schemas/ProgramOffering'
                              academicSession:
                                $ref: '#/components/schemas/AcademicSession'
                        - allOf:
                          - $ref: '#/components/schemas/CourseOfferingAssociation'
                          - type: object
                            required:
                            - offering
                            properties:
                              offering:
                                $ref: '#/components/schemas/CourseOffering'
                              academicSession:
                                $ref: '#/components/schemas/AcademicSession'
                        - allOf:
                          - $ref: '#/components/schemas/ComponentOfferingAssociation'
                          - type: object
                            required:
                            - offering
                            properties:
                              offering:
                                $ref: '#/components/schemas/ComponentOffering'
                              academicSession:
                                $ref: '#/components/schemas/AcademicSession'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest_2'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized_2'
        '403':
          $ref: '#/components/responses/ErrorForbidden_2'
        '404':
          $ref: '#/components/responses/ErrorNotFound_2'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed_2'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests_2'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError_2'
      operationId: getPersonsByPersonIdAssociations
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /persons/{personId}/groups:
    get:
      summary: GET /persons/{personId}/groups
      description: Get an ordered list of all groups for a given person, ordered by name.
      tags:
      - Persons
      parameters:
      - name: personId
        in: path
        description: Person ID
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer_2'
      - $ref: '#/components/parameters/search'
      - name: groupType
        in: query
        description: Filter by group type
        required: false
        schema:
          $ref: '#/components/schemas/groupType'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - groupId
            - name
            - startDate
            - -groupId
            - -name
            - -startDate
          default:
          - name
          example:
          - name
          - -groupId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - pageSize
                - pageNumber
                - hasPreviousPage
                - hasNextPage
                - items
                properties:
                  pageSize:
                    type: integer
                    format: int32
                    description: The number of items per page
                  pageNumber:
                    type: integer
                    format: int32
                    description: The current page number
                  hasPreviousPage:
                    type: boolean
                    description: Whether there is a previous page
                  hasNextPage:
                    type: boolean
                    description: Whether there is a previous page
                  totalPages:
                    type: integer
                    format: int32
                    description: Total number of pages
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  ext:
                    $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest_2'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized_2'
        '403':
          $ref: '#/components/responses/ErrorForbidden_2'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed_2'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests_2'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError_2'
      operationId: getPersonsByPersonIdGroups
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
components:
  schemas:
    Consumer:
      type: object
      description: The additional elements of a consumer that may be provided, see the [documentation on support for specific consumers](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/) for further information about this mechanism.
      required:
      - consumerKey
      properties:
        consumerKey:
          description: The key of the consumer (destination) for which this information is intended. See the [consumer registry](https://oeapi.eu/v6.0/#/technical/consumers-and-profiles/). This key is used to select the additional data to be presented in the request.
          type: string
          example: test-consumer
        exampleProperty:
          description: An example of an additional property
          type:
          - string
          - 'null'
          example: value-of-example-property
      additionalProperties: true
    PostResponse:
      type: object
      description: A system message as a response to a POST message
      required:
      - message
      properties:
        message:
          description: information displayed to user
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: Your enrolment was partly successful, you have been placed on the waiting list
        redirect:
          description: URL where additional information can be found e.g. by use of deep link
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          example: https://university.example.org/
    type:
      type: string
      format: uri
      maxLength: 2048
      description: "An absolute URI that identifies the problem type. When dereferenced, \nit should provide human-readable documentation.\n"
      example: https://example.org/problems/bad-request
    Nationality:
      type: object
      description: 'An object indicating nationality based on at least one iso-3166 code. In situations where more than one iso-3166 code is provided the codes have address the same country.

        '
      properties:
        iso3166-1-alpha2:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
          example: NL
        iso3166-1-alpha3:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
          description: A country code based on https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3
          example: NLD
        iso3166-3:
          type:
          - string
          - 'null'
          minLength: 4
          maxLength: 4
          description: 'A nationality code for a country that no longer exists on https://en.wikipedia.org/wiki/ISO_3166-3 It is not advised to use the original iso3166-1 for such a country since country codes can get reassigned to new countries ones the original country code is officially obsolete. It is possible that a person has a nationality of a country that does not exist any more (after a country got split up like CZ and YU)\ and never applied for nationality of one of the new countries.

            '
          example: ANHH
    PersonId:
      type: object
      properties:
        personId:
          type: string
          description: Unique id of this person
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - personId
    Address:
      type: object
      description: The full street address
      required:
      - addressType
      properties:
        addressType:
          $ref: '#/components/schemas/addressType'
        street:
          type:
          - string
          - 'null'
          description: The street name
          example: Moreelsepark
        streetNumber:
          type:
          - string
          - 'null'
          description: The street number
          example: '48'
        additional:
          type:
          - array
          - 'null'
          description: Further details like building name, suite, apartment number, etc.
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageTypedString'
          example:
          - language: en-GB
            value: On the other side of the road
        postCode:
          type:
          - string
          - 'null'
          description: Code to help sort and deliver mail also known as Postal code and ZIP code
          example: 3511 EP
        city:
          type:
          - string
          - 'null'
          description: name of the city / locality
          example: Utrecht
        countryCode:
          oneOf:
          - $ref: '#/components/schemas/Country'
          - type: 'null'
        geolocation:
          type:
          - object
          - 'null'
          description: Geolocation of the entrance of this address (WGS84 coordinate reference system)
          required:
          - latitude
          - longitude
          properties:
            latitude:
              type: number
              format: double
              example: 52.089123
            longitude:
              type: number
              format: double
              example: 5.113337
        ext:
          oneOf:
          - $ref: '#/components/schemas/Ext'
          - type: 'null'
    Language:
      description: 'The language used in the described entity. The value **must be a language tag that conforms to RFC 5646** (Tags for Identifying Languages, BCP 47):

        https://www.rfc-editor.org/rfc/rfc5646.html


        A tag consists of the following components, in this exact order:

        1. **language** – two‑ to three‑letter codes (ISO 639‑1/‑2) **or** four‑letter codes (ISO 639‑5) **or** five‑ to eight‑letter registered language subtags.

        2. **script** – optional, four letters in Title‑Case (e.g. `Latn`, `Hant`).

        3. **region** – optional, either two uppercase letters (ISO 3166‑1) **or** three digits (UN M.49).

        4. **variant** – zero or more subtags, each either five‑ to eight‑alphanumerics or a digit followed by three alphanumerics (e.g. `1901`, `oxendict`).

        5. **extension** – zero or more extensions. Each extension starts with a *singleton* (a single alphanumeric character except `x`) followed by one or more subtags of two‑ to eight‑alphanumerics (e.g. `u‑co‑phonebk`).

        6. **private‑use** – optional, the letter `x` followed by one or more subtags of one‑ to eight‑alphanumerics (e.g. `x‑private`).


        The most common form is a two‑letter language code (ISO 639‑1) optionally followed by a hyphen and a two‑letter country code (ISO 3166‑1), for example `en` or `en‑GB`.


        More specific tags are also valid, for instance `zh‑Hant‑TW` (Traditional Chinese as used in Taiwan).


        For sign languages two conventions are recognised:

        * `sgn` – e.g. `nl‑sgn‑NL` (Dutch Sign Language)

        * `s`   – e.g. `nl‑s‑NL` (Dutch Sign Language)

        '
      type: string
      minLength: 2
      pattern: ^(?:(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,2}|[A-Za-z]{4}|[A-Za-z]{5,8})(?:-[A-Za-z]{4})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*?(?:-(?:[A-WY-Za-wy-z0-9](?:-[A-Za-z0-9]{2,8})+))*?(?:-x(?:-[A-Za-z0-9]{1,8})+)?|x(?:-[A-Za-z0-9]{1,8})+)$
      example: en-GB
    personAffiliation:
      type: string
      description: 'The affiliations of this person — the roles or relationships a person has with the organisation providing this endpoint:


        - student: Enrolled learner or participant in educational offerings

        - employee: Staff member employed by the organisation (e.g. teacher, administrator)

        - guest: External person temporarily affiliated, without formal student or employee status


        This is an extensible enumeration. Use the prefix `x-` for custom values.

        '
      x-ooapi-extensible-enum:
      - student
      - employee
      - guest
      example: student
    gender:
      type: string
      description: 'The gender of this person, based on international standards for education and data interoperability.


        The values follow practices from agencies such as:

        - European Commission (EULF, INSPIRE, GeoDCAT-AP)

        - Edustandaard, EUNIS


        - m: male

        - f: female

        - x: non-binary or gender-diverse, officially registered

        - o: other gender identity, not officially classified as m/f/x

        - u: unknown or not registered

        - n: not applicable, e.g. for non-person entities or gender-irrelevant use cases

        '
      x-ooapi-extensible-enum:
      - m
      - f
      - x
      - o
      - u
      - n
      example: f
    Person:
      allOf:
      - $ref: '#/components/schemas/PersonId'
      - $ref: '#/components/schemas/PersonProperties'
    Ext:
      type: object
      description: Object for additional non-standard attributes
    ProblemVersionNotAcceptable:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - requestedVersion
        - supportedVersions
        properties:
          type:
            $ref: '#/components/schemas/type'
          title:
            $ref: '#/components/schemas/title'
          consumer:
            description: 'Indicates which party caused the version mismatch. When null, the 406 was

              triggered by an unsupported OEAPI version. If populated with a Consumer

              object, the 406 was caused by a consumer-specific version that did not match

              any supported version. This field MAY contain a full Consumer object or be

              null.

              '
            oneOf:
            - $ref: '#/components/schemas/Consumer'
            - type: 'null'
          requestedVersion:
            type: string
            description: The version requested by the client.
            example: '5.0'
          supportedVersions:
            type: array
            description: Versions the server can serve, typically in descending order.
            items:
              type: string
            example:
            - '4.2'
            - '4.1'
    PersonProperties:
      type: object
      description: A person that has a relationship with this institution
      anyOf:
      - required:
        - surname
        - primaryCode
        - activeEnrolment
      - title: With required given name
        required:
        - givenName
        - primaryCode
        - activeEnrolment
      - title: With required preferred name
        required:
        - preferredName
        - primaryCode
        - activeEnrolment
      properties:
        primaryCode:
          description: The primary human readable identifier for the person. This is often the source identifier as defined by the institution.
          $ref: '#/components/schemas/IdentifierEntry'
          example:
            codeType: studentNumber
            code: 0
        givenName:
          type:
          - string
          - 'null'
          description: The first name of this person
          maxLength: 256
          example: Martina
        alternateName:
          type:
          - string
          - 'null'
          description: The Name a person chooses to use. this is part of a Self Sovereign name e.g. in the eduId process comparable to schema.org alternateName
          maxLength: 256
          example: Marieke
        preferredName:
          type:
          - string
          - 'null'
          description: The name how the person would like to be called. Usually first name of this person. In line with ISO/IEC 24760 – Identity Management Vocabulary
          maxLength: 256
          example: Maartje
        surnamePrefix:
          type:
          - string
          - 'null'
          description: The prefix of the family name of this person
          example: van
        surname:
          type: string
          description: The family name of this person
          maxLength: 256
          example: Damme
        displayName:
          type:
          - string
          - 'null'
          description: The name of this person which will be displayed
          maxLength: 256
          example: Maartje van Damme
        initials:
          type:
          - string
          - 'null'
          description: The initials of this person
          example: MCW
        idCheckName:
          type:
          - string
          - 'null'
          description: "The name of the person as printed on official identification documents\n(driving licence, passport or identity card). This MUST be formatted as\n\"surname prefix surname, given names\" (separating surnamePrefix and surname\nwith a single space, and surname and given names with a comma and space).\n\nIf the surname or given names are not available or are secret, the values\n\"secret\" and \"not_available\" are recommended. The surname prefix may be\nomitted. E.g. \"van der Graaf, Jacobus Adrianus\". \n\nOptionally, the value of\nthe student number can be added to this field by appending it at the end,\nseparated by a comma. E.g. \"van der Graaf, Jacobus Adrianus, s12345678\"\n"
          example: van der Graaf, Jacobus Adrianus, s12345678
        activeEnrolment:
          type: boolean
          description: Whether this person has an active enrolment.
          example: false
        dateOfBirth:
          type:
          - string
          - 'null'
          description: "The date of birth of this person, using the `full-date` format as defined in \nRFC 3339 (section 5.6).\n"
          format: date
          example: '2003-09-30'
        cityOfBirth:
          type:
          - string
          - 'null'
