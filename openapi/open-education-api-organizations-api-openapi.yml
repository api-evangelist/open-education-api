openapi: 3.2.0
info:
  title: Open Education Organizations API
  version: 5.0.0
  x-logo:
    url: ../logo.png
  description: 'Operations tagged organizations across 2 of this provider''s published API definitions: ooapi-v5.yaml, open-education-api-v5-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://demo01.eduapi.nl/v5
  description: SURF demo implementation
tags:
- name: Organizations
  description: The organizations API provides the organizations that are responsible for the execution and recognition of education.
paths:
  /organizations:
    get:
      summary: GET /organizations
      description: Get an ordered list of all organizations, ordered by name.
      tags:
      - Organizations
      parameters:
      - $ref: '#/components/parameters/primaryCode'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/consumer'
      - $ref: '#/components/parameters/search'
      - name: organizationType
        in: query
        description: Filter by organization type
        required: false
        schema:
          $ref: '#/components/schemas/organizationType'
      - name: sort
        in: query
        explode: false
        description: 'Sort by one or more attributes, the default is ascending. Prefixing the attribute with a minus sign `-` allows for descending sort. Examples: [ATTR | -ATTR | ATTR1,-ATTR2]'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - organizationId
            - name
            - -organizationId
            - -name
          default:
          - name
          example:
          - name
          - -organizationId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  required:
                  - items
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
                    ext:
                      $ref: '#/components/schemas/Ext'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getOrganizations
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
  /organizations/{organizationId}:
    get:
      summary: GET /organizations/{organizationId}
      description: Get a single organization.
      tags:
      - Organizations
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      - name: expand
        in: query
        explode: false
        description: Optional properties to expand, separated by a comma
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - parent
            - children
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '405':
          $ref: '#/components/responses/ErrorMethodNotAllowed'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternalServerError'
      operationId: getOrganizationsByOrganizationId
      x-operation-id-source: derived
    servers:
    - url: http://demo01.eduapi.nl/v5
      description: SURF demo implementation
